<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云端上的桥梁 · 贵州世界桥梁博物馆 · 交互故事地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <style>
    /* 贵州桥梁主题：钢灰、江蓝、混凝土、锈橙、峡谷绿 */
    :root {
      --bg-deep: #2a3540;
      --bg-panel: #f4f1eb;
      --steel: #5c6d7e;
      --steel-dark: #3d4f5f;
      --river: #3d7a9b;
      --river-light: #5a9fc4;
      --rust: #b85c38;
      --concrete: #e8e4dc;
      --canyon: #4a6b5a;
      --accent: #41b7a6;
      --text: #2c3338;
      --muted: #5c6570;
      --header-h: 56px;
      --nav-h: 44px;
      --timeline-h: 52px;
      --panel-w: min(420px, 38vw);
      --shadow: 0 8px 32px rgba(26, 35, 45, 0.18);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      overflow: hidden;
    }

    /* ========== 顶栏 ========== */
    .app-header {
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: linear-gradient(90deg, var(--steel-dark), var(--steel));
      color: #fff;
      border-bottom: 2px solid var(--rust);
      z-index: 1000;
    }

    .brand h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .brand p {
      font-size: 0.72rem;
      opacity: 0.85;
      margin-top: 2px;
    }

    .chapter-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 55%;
    }

    .chapter-tabs button {
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.08);
      color: #e8eef2;
      padding: 5px 10px;
      font-size: 0.72rem;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.25s var(--ease), border-color 0.25s;
      white-space: nowrap;
    }

    .chapter-tabs button:hover { background: rgba(255,255,255,0.18); }
    .chapter-tabs button.active {
      background: var(--rust);
      border-color: var(--rust-light, #d4845c);
      color: #fff;
    }

    /* ========== 主布局：叙事窗格 + 地图（地图 >50%） ========== */
    .app-body {
      display: flex;
      height: calc(100vh - var(--header-h) - var(--timeline-h));
      position: relative;
    }

    .story-panel {
      width: var(--panel-w);
      min-width: 300px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-right: 1px solid #c5cdd6;
      display: flex;
      flex-direction: column;
      z-index: 500;
      box-shadow: var(--shadow);
    }

    .story-progress {
      height: 4px;
      background: #d8dde3;
    }

    .story-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--river), var(--accent));
      transition: width 0.5s var(--ease);
    }

    .story-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px 12px;
      scroll-behavior: smooth;
    }

    .step-badge {
      display: inline-block;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      color: var(--river);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .step-title {
      font-size: 1.35rem;
      color: var(--steel-dark);
      line-height: 1.35;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .step-title .accent { color: var(--rust); }

    .step-body {
      font-size: 0.92rem;
      line-height: 1.75;
      color: var(--muted);
    }

    .step-body strong { color: var(--text); }
    .step-body p + p { margin-top: 10px; }

    .step-meta {
      margin-top: 14px;
      padding: 10px 12px;
      background: var(--concrete);
      border-left: 3px solid var(--accent);
      font-size: 0.8rem;
      color: var(--steel-dark);
      border-radius: 0 6px 6px 0;
    }

    .story-controls {
      display: flex;
      gap: 8px;
      padding: 12px 14px;
      border-top: 1px solid #d0d6dc;
      background: #faf9f7;
    }

    .story-controls button {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid var(--steel);
      background: #fff;
      color: var(--steel-dark);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .story-controls button:hover:not(:disabled) {
      background: var(--river);
      color: #fff;
      border-color: var(--river);
    }

    .story-controls button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .story-controls .btn-primary {
      background: var(--rust);
      color: #fff;
      border-color: var(--rust);
    }

    .story-controls .btn-primary:hover:not(:disabled) {
      background: #9a4a2c;
      border-color: #9a4a2c;
    }

    /* 占位：嵌入 / 图 / 视频 */
    .media-placeholder {
      margin-top: 14px;
      border: 2px dashed #a8b4c0;
      border-radius: 8px;
      background: repeating-linear-gradient(
        -45deg,
        #eceae4,
        #eceae4 8px,
        #f8f6f2 8px,
        #f8f6f2 16px
      );
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .media-placeholder i {
      font-size: 1.6rem;
      color: var(--steel);
      margin-bottom: 8px;
    }

    .media-placeholder.embed { min-height: 200px; }
    .media-placeholder.video { min-height: 160px; }

    .embed-wrap { margin-top: 12px; }
    .embed-wrap .embed-caption {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .embed-frame {
      width: 100%;
      height: 280px;
      min-height: 220px;
      display: block;
    }

    .story-img {
      margin-top: 12px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #c5cdd6;
      background: #fff;
    }

    .story-img img {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      display: block;
    }

    .story-img figcaption {
      padding: 8px 10px;
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--concrete);
    }

    .story-video {
      margin-top: 12px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #c5cdd6;
      background: #1a2229;
    }

    .story-video iframe,
    .story-video video {
      width: 100%;
      display: block;
      min-height: 180px;
      border: none;
    }

    .story-video figcaption {
      padding: 8px 10px;
      font-size: 0.75rem;
      color: #b8c5d0;
      background: #2a3540;
    }

    .story-gallery {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .story-gallery img {
      width: 100%;
      height: 88px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #c5cdd6;
    }

    .data-cards {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .data-card {
      background: var(--concrete);
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      border-left: 3px solid var(--rust);
    }

    .data-card strong {
      display: block;
      font-size: 1.1rem;
      color: var(--rust);
    }

    .data-card span { font-size: 0.72rem; color: var(--muted); }

    .code-hint {
      margin-top: 10px;
      padding: 8px 10px;
      background: #2a3540;
      color: #a8d4c4;
      font-family: Consolas, monospace;
      font-size: 0.7rem;
      border-radius: 6px;
      word-break: break-all;
    }

    .cover-screen.has-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background: center/cover no-repeat var(--cover-bg);
      opacity: 0.35;
      z-index: 0;
    }

    .cover-screen.has-bg > * { position: relative; z-index: 1; }

    .leaflet-popup-content .pop-img {
      width: 100%;
      max-height: 120px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    /* 卷帘对比（真实图片） */
    .swipe-demo {
      margin-top: 12px;
      position: relative;
      height: 140px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #c5cdd6;
      user-select: none;
    }

    .swipe-demo .layer-a,
    .swipe-demo .layer-b {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .swipe-demo { height: 180px; }

    .swipe-demo .layer-a,
    .swipe-demo .layer-b {
      background-size: cover;
      background-position: center;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }

    .swipe-demo .layer-a {
      clip-path: inset(0 50% 0 0);
      z-index: 2;
    }

    .swipe-demo .layer-b { z-index: 1; }

    .swipe-demo input[type="range"] {
      position: absolute;
      bottom: 8px;
      left: 10%;
      width: 80%;
      z-index: 5;
      accent-color: var(--rust);
    }

    /* ========== 地图区 ========== */
    .map-stage {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #d8e0e8;
    }

    /* 瓦片加载失败时不显示黑块（Carto {r} 高清瓦片在国内常失败） */
    .leaflet-tile-pane img.leaflet-tile {
      background: #d8e0e8;
    }

    .leaflet-tile-loaded { background: transparent; }

    .leaflet-popup-content { margin: 10px 12px; line-height: 1.55; max-width: 280px; }
    .leaflet-popup-content h4 { margin: 0 0 6px; color: var(--steel-dark); font-size: 0.95rem; }
    .leaflet-popup-content .tag { color: var(--rust); font-size: 0.78rem; }
    .leaflet-popup-content .desc { color: var(--muted); font-size: 0.82rem; margin-top: 6px; }

    .prefecture-label {
      background: transparent;
      border: none;
      box-shadow: none;
      font-size: 0.7rem;
      font-weight: 600;
      color: #2c4a5e;
      white-space: nowrap;
    }

    .map-overlay-top {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 800;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      pointer-events: none;
    }

    .coord-pill, .chapter-pill {
      padding: 6px 14px;
      font-size: 0.72rem;
      font-variant-numeric: tabular-nums;
      background: rgba(244, 241, 235, 0.95);
      border: 1px solid var(--steel);
      border-radius: 20px;
      color: var(--steel-dark);
      box-shadow: var(--shadow);
    }

    .chapter-pill { color: var(--rust); font-weight: 600; }

    .map-tools {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 800;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .map-tools button, .map-tools select {
      padding: 8px 12px;
      border: 1px solid var(--steel);
      background: rgba(244, 241, 235, 0.96);
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--steel-dark);
    }

    .map-tools button:hover { background: var(--river); color: #fff; border-color: var(--river); }

    .layer-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      font-size: 0.72rem;
      background: rgba(244, 241, 235, 0.96);
      border: 1px solid var(--steel);
      border-radius: 6px;
      cursor: pointer;
      color: var(--steel-dark);
    }

    .layer-toggle input { accent-color: var(--rust); }

    .map-legend {
      position: absolute;
      bottom: 16px;
      right: 12px;
      z-index: 800;
      background: rgba(244, 241, 235, 0.96);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.72rem;
      border: 1px solid #c5cdd6;
      max-width: 200px;
    }

    .map-legend h4 {
      font-size: 0.75rem;
      margin-bottom: 6px;
      color: var(--steel-dark);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ========== 底部时间轴（第三章启用） ========== */
    .timeline-bar {
      height: var(--timeline-h);
      background: linear-gradient(180deg, #3d4f5f, #2a3540);
      border-top: 2px solid var(--accent);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      z-index: 900;
    }

    .timeline-bar.disabled { opacity: 0.45; pointer-events: none; }

    .timeline-label {
      font-size: 0.75rem;
      color: #b8c5d0;
      white-space: nowrap;
    }

    .timeline-track {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 4px;
      position: relative;
    }

    .timeline-years {
      display: flex;
      justify-content: space-between;
      width: 100%;
      position: relative;
    }

    .timeline-years button {
      flex: 1;
      max-width: 72px;
      padding: 6px 4px;
      border: none;
      background: transparent;
      color: #8fa3b0;
      font-size: 0.7rem;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.25s;
    }

    .timeline-years button:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .timeline-years button.active {
      color: #fff;
      background: var(--rust);
      font-weight: 600;
    }

    input#yearSlider {
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 100%;
      height: 4px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* ========== 封面 ========== */
    .cover-screen {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: linear-gradient(160deg, #1e2830 0%, #3d4f5f 50%, #4a6b5a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      transition: opacity 0.8s var(--ease), visibility 0.8s;
    }

    .cover-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .cover-screen h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      color: #fff;
      letter-spacing: 0.15em;
      margin-bottom: 12px;
    }

    .cover-screen .subtitle {
      color: var(--river-light);
      font-size: 1rem;
      margin-bottom: 28px;
    }

    .cover-screen .hint {
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .cover-screen button {
      padding: 14px 36px;
      font-size: 1rem;
      background: var(--rust);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: 0.1em;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cover-screen button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(184, 92, 56, 0.45);
    }

    /* Leaflet 标记 */
    .bridge-marker {
      background: var(--rust);
      border: 2px solid #fff;
      border-radius: 50%;
      text-align: center;
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      line-height: 26px;
      width: 28px !important;
      height: 28px !important;
      margin-left: -14px !important;
      margin-top: -14px !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }

    .bridge-marker.active {
      background: var(--accent);
      transform: scale(1.15);
      z-index: 1000 !important;
    }

    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      font-size: 0.85rem;
    }

    @media (max-width: 900px) {
      .app-body { flex-direction: column-reverse; }
      .story-panel {
        width: 100%;
        max-height: 42vh;
        min-width: unset;
      }
      .map-stage { min-height: 48vh; }
      .chapter-tabs { display: none; }
    }
  </style>
</head>
<body>

  <!-- 封面：参考「向下滚动开启旅程」 -->
  <div class="cover-screen has-bg" id="coverScreen">
    <p class="hint">scroll · 地图漫游 · 时间轴</p>
    <h1>云端上的桥梁</h1>
    <p class="subtitle">贵州「世界桥梁博物馆」时空地图<br>从「地无三尺平」到「高速平原」</p>
    <button type="button" id="btnStart"><i class="fa-solid fa-play"></i> 开启地图叙事</button>
  </div>

  <header class="app-header">
    <div class="brand">
      <h1>云端上的桥梁 · 交互故事地图</h1>
      <p>Leaflet · 地图驱动叙事 · 五章漫游</p>
    </div>
    <nav class="chapter-tabs" id="chapterTabs" aria-label="章节导航"></nav>
  </header>

  <div class="app-body">
    <aside class="story-panel">
      <div class="story-progress"><div class="story-progress-fill" id="progressFill"></div></div>
      <div class="story-scroll" id="storyScroll"></div>
      <div class="story-controls">
        <button type="button" id="btnPrev"><i class="fa-solid fa-chevron-left"></i> 上一步</button>
        <button type="button" class="btn-primary" id="btnNext">下一步 <i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </aside>

    <main class="map-stage">
      <div class="map-overlay-top">
        <span class="chapter-pill" id="chapterPill">序幕</span>
        <span class="coord-pill" id="coordPill"><i class="fa-solid fa-location-crosshairs"></i> 106.70°E, 26.58°N · 缩放 7</span>
      </div>
      <div class="map-tools">
        <select id="basemapSelect" aria-label="底图">
          <option value="osm" selected>街道图（默认·稳定）</option>
          <option value="light">浅色简洁图</option>
          <option value="satellite">卫星影像</option>
          <option value="topo">地形晕渲</option>
        </select>
        <button type="button" id="btnFitGuizhou" title="复位贵州省域">复位全省</button>
        <label class="layer-toggle"><input type="checkbox" id="chkBridges" checked /> 桥梁</label>
        <label class="layer-toggle"><input type="checkbox" id="chkRoads" checked /> 高速</label>
        <label class="layer-toggle"><input type="checkbox" id="chkRegions" checked /> 市州</label>
      </div>
      <div id="map"></div>
      <div class="map-legend" id="mapLegend">
        <h4>图例</h4>
        <div class="legend-item"><span class="legend-dot" style="background:#b85c38"></span> 代表性桥梁</div>
        <div class="legend-item"><span class="legend-dot" style="background:#41b7a6"></span> 当前聚焦桥梁</div>
        <div class="legend-item"><span class="legend-dot" style="background:rgba(61,122,155,0.35);border:1px solid #3d7a9b"></span> 市州范围（示意）</div>
        <div class="legend-item"><span class="legend-dot" style="background:#e67e22;width:18px;height:3px;border-radius:1px"></span> 高速公路（按年份显示）</div>
        <div class="legend-item"><span class="legend-dot" style="background:transparent;border:2px dashed #b85c38;width:14px;height:14px;border-radius:2px"></span> 贵州省界</div>
      </div>
    </main>
  </div>

  <footer class="timeline-bar disabled" id="timelineBar">
    <span class="timeline-label"><i class="fa-solid fa-clock"></i> 路网编年</span>
    <div class="timeline-track">
      <div class="timeline-years" id="timelineYears"></div>
      <input type="range" id="yearSlider" min="0" max="4" value="0" step="1" aria-label="年份滑块" />
    </div>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    /* ============================================================
     * 地图 API 选型说明（写在代码里供课程说明）
     * - 主引擎：Leaflet 1.9（轻量、无密钥、易与滚动叙事联动）

    /* ---------- 扁平步骤索引 ---------- */
    const flatSteps = [];
    STORY.forEach((ch, ci) => {
      ch.steps.forEach((st, si) => {
        flatSteps.push({ chapterIndex: ci, stepIndex: si, chapter: ch, step: st });
      });
    });

    let map, basemaps = {}, activeBasemap;
    let bridgeLayer, regionLayer, roadLayer, outlineLayer, prefectureLayer;
    let bridgeMarkers = {};
    let layerVisible = { bridges: true, roads: true, regions: true };
    let currentRoadYear = 2014;
    let currentFlatIndex = 0;
    let flyToken = 0;

    const el = {
      cover: document.getElementById("coverScreen"),
      btnStart: document.getElementById("btnStart"),
      chapterTabs: document.getElementById("chapterTabs"),
      storyScroll: document.getElementById("storyScroll"),
      progressFill: document.getElementById("progressFill"),
      btnPrev: document.getElementById("btnPrev"),
      btnNext: document.getElementById("btnNext"),
      chapterPill: document.getElementById("chapterPill"),
      coordPill: document.getElementById("coordPill"),
      basemapSelect: document.getElementById("basemapSelect"),
      btnFitGuizhou: document.getElementById("btnFitGuizhou"),
      timelineBar: document.getElementById("timelineBar"),
      timelineYears: document.getElementById("timelineYears"),
      yearSlider: document.getElementById("yearSlider"),
      chkBridges: document.getElementById("chkBridges"),
      chkRoads: document.getElementById("chkRoads"),
      chkRegions: document.getElementById("chkRegions")
    };

    function bridgePopupHtml(b) {
      const img = b.image
        ? `<img class="pop-img" src="${b.image}" alt="${b.name}" loading="lazy" onerror="this.style.display='none'"/>`
        : "";
      return `${img}<h4>${b.name}</h4>
        <div class="tag">${b.type} · ${b.year}年 · ${b.tag}${b.span ? " · " + b.span : ""}</div>
        <div class="desc">${b.desc}</div>`;
    }

    function applyCoverBackground() {
      if (CONFIG.media.cover) {
        el.cover.style.setProperty("--cover-bg", `url('${CONFIG.media.cover}')`);
      }
    }

    function initMap() {
      map = L.map("map", {
        center: CONFIG.guizhouCenter,
        zoom: CONFIG.guizhouZoom,
        zoomControl: true,
        attributionControl: true,
        preferCanvas: true
      });

      /* 勿使用 Carto URL 中的 {r} 高清参数，国内常加载失败呈黑色方块 */
      basemaps.osm = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        { attribution: "&copy; OpenStreetMap", ...TILE_OPTS }
      );
      basemaps.light = L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
        { attribution: "&copy; OSM &copy; CARTO", subdomains: "abcd", ...TILE_OPTS }
      );
      basemaps.satellite = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { attribution: "Tiles &copy; Esri", maxZoom: 18, errorTileUrl: TILE_ERROR_URL }
      );
      basemaps.topo = L.tileLayer(
        "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
        { attribution: "&copy; OpenTopoMap", maxZoom: 17, errorTileUrl: TILE_ERROR_URL }
      );

      activeBasemap = basemaps.osm;
      activeBasemap._key = "osm";
      activeBasemap.addTo(map);

      outlineLayer = L.layerGroup();
      L.polygon(GUIZHOU_OUTLINE, {
        color: "#b85c38",
        weight: 2,
        fillColor: "#41b7a6",
        fillOpacity: 0.06,
        dashArray: "10 6"
      }).bindPopup("<strong>贵州省</strong><br>无平原支撑省份 · 故事地图主区域").addTo(outlineLayer);

      prefectureLayer = L.layerGroup();
      PREFECTURES.forEach((p) => {
        const poly = L.polygon(p.ring, {
          color: "#3d7a9b",
          weight: 1.5,
          fillColor: "#5a9fc4",
          fillOpacity: 0.12
        }).bindPopup(`<strong>${p.name}</strong><br>市州范围（教学示意面，非精确行政界）`);
        poly.addTo(prefectureLayer);
        const c = poly.getBounds().getCenter();
        L.marker(c, {
          icon: L.divIcon({ className: "prefecture-label", html: p.name, iconSize: [60, 16] })
        }).addTo(prefectureLayer);
      });

      roadLayer = L.layerGroup();
      bridgeLayer = L.layerGroup();
      regionLayer = L.layerGroup();

      BRIDGES.forEach((b) => {
        const icon = L.divIcon({ className: "bridge-marker", html: "桥", iconSize: [28, 28] });
        const m = L.marker([b.lat, b.lng], { icon }).bindPopup(bridgePopupHtml(b));
        bridgeMarkers[b.name] = m;
        bridgeLayer.addLayer(m);
      });

      REGIONS.forEach((r) => {
        L.circleMarker([r.lat, r.lng], {
          radius: 9,
          color: "#2c5f7a",
          fillColor: "#41b7a6",
          fillOpacity: 0.9,
          weight: 2
        })
          .bindPopup(`<strong>${r.name}</strong><br>${r.tip || ""}`)
          .addTo(regionLayer);
      });

      outlineLayer.addTo(map);
      renderHighwaysByYear(2014);

      map.on("move zoom", updateCoordPill);
      map.on("baselayerchange", () => map.invalidateSize());
      updateCoordPill();
    }

    function updateCoordPill() {
      if (!map) return;
      const c = map.getCenter();
      el.coordPill.innerHTML =
        `<i class="fa-solid fa-location-crosshairs"></i> ${c.lng.toFixed(2)}°E, ${c.lat.toFixed(2)}°N · 缩放 ${map.getZoom()}`;
    }

    function setBasemap(key) {
      if (!basemaps[key] || (activeBasemap && activeBasemap._key === key)) return;
      map.removeLayer(activeBasemap);
      activeBasemap = basemaps[key];
      activeBasemap._key = key;
      activeBasemap.addTo(map);
    }

    function renderHighwaysByYear(year) {
      currentRoadYear = year;
      roadLayer.clearLayers();
      HIGHWAYS.forEach((hw) => {
        if (hw.openYear > year) return;
        L.polyline(hw.coords, {
          color: hw.color,
          weight: hw.weight,
          opacity: 0.82,
          dashArray: hw.dash || null,
          lineCap: "round"
        })
          .bindPopup(`<strong>${hw.name}</strong><br>开通年份：${hw.openYear}<br>截至 ${year} 年已纳入示意路网`)
          .addTo(roadLayer);
      });
      if (layerVisible.roads) roadLayer.addTo(map);
    }

    function syncOverlayLayers() {
      if (layerVisible.bridges) bridgeLayer.addTo(map);
      else bridgeLayer.removeFrom(map);
      if (layerVisible.roads) roadLayer.addTo(map);
      else roadLayer.removeFrom(map);
      if (layerVisible.regions) {
        regionLayer.addTo(map);
        prefectureLayer.addTo(map);
      } else {
        regionLayer.removeFrom(map);
        prefectureLayer.removeFrom(map);
      }
      outlineLayer.addTo(map);
    }

    function flyToStep(step) {
      const token = ++flyToken;
      const m = step.map || { center: CONFIG.guizhouCenter, zoom: CONFIG.guizhouZoom };
      const center = Array.isArray(m.center) ? [m.center[0], m.center[1]] : m.center;
      const dur = m.duration || 1.0;

      map.flyTo(center, m.zoom || 7, { duration: dur });

      setTimeout(() => {
        if (token !== flyToken) return;
        applyMapLayers(step);
      }, dur * 1000 * 0.6);
    }

    function applyMapLayers(step) {
      const showBridges = step.showBridges !== false && layerVisible.bridges;
      const showRegions = !!step.showRegions && layerVisible.regions;
      const showRoads = !!(step.enableTimeline || step.roadYear) && layerVisible.roads;

      if (showBridges) bridgeLayer.addTo(map);
      else bridgeLayer.removeFrom(map);

      if (showRegions) {
        regionLayer.addTo(map);
        prefectureLayer.addTo(map);
      } else {
        regionLayer.removeFrom(map);
        prefectureLayer.removeFrom(map);
      }

      outlineLayer.addTo(map);

      Object.entries(bridgeMarkers).forEach(([name, marker]) => {
        const iconEl = marker.getElement();
        if (iconEl) iconEl.classList.toggle("active", name === step.highlightBridge);
      });

      if (step.highlightBridge && bridgeMarkers[step.highlightBridge]) {
        const b = BRIDGES.find((x) => x.name === step.highlightBridge);
        bridgeMarkers[step.highlightBridge].openPopup();
        if (b) map.flyTo([b.lat, b.lng], (step.map && step.map.zoom) || 11, { duration: 0.9 });
      }

      if (step.enableTimeline || step.roadYear) {
        const y = step.roadYear || ROAD_YEARS[parseInt(el.yearSlider.value, 10)] || 2014;
        renderHighwaysByYear(y);
        if (showRoads) roadLayer.addTo(map);
      } else {
        roadLayer.removeFrom(map);
      }

      if (step.regionIndex != null && REGIONS[step.regionIndex] && !step.highlightBridge) {
        const r = REGIONS[step.regionIndex];
        map.flyTo([r.lat, r.lng], r.zoom, { duration: 0.8 });
      }
    }

    function imageBlock(src, caption) {
      if (!src) return "";
      return `<figure class="story-img">
        <img src="${src}" alt="${caption || ""}" loading="lazy" onerror="this.parentElement.classList.add('media-placeholder')"/>
        <figcaption>${caption || ""}</figcaption>
      </figure>`;
    }

    function videoBlock(keyOrObj) {
      const v = typeof keyOrObj === "string" ? CONFIG.videos[keyOrObj] : keyOrObj;
      if (!v || !v.src) return "";
      const src = v.src.startsWith("//") ? "https:" + v.src : v.src;
      return `<figure class="story-video">
        <iframe src="${src}" allowfullscreen allow="autoplay; fullscreen" title="${v.caption || "视频"}"></iframe>
        <figcaption>${v.caption || ""}</figcaption>
      </figure>`;
    }

    function galleryBlock(urls) {
      if (!urls || !urls.length) return "";
      return `<div class="story-gallery">${urls.map((u, i) =>
        `<img src="${u.url || u}" alt="${u.cap || "图" + (i + 1)}" loading="lazy" onerror="this.style.opacity=0.3"/>`
      ).join("")}</div>`;
    }

    function dataCardsBlock(cards) {
      if (!cards || !cards.length) return "";
      return `<div class="data-cards">${cards.map((c) =>
        `<div class="data-card"><strong>${c.value}</strong><span>${c.label}</span></div>`
      ).join("")}</div>`;
    }

    function embedBlock(key, label) {
      const url = CONFIG.embeds[key];
      if (!url) {
        return `<div class="media-placeholder embed"><i class="fa-solid fa-code"></i><span>未配置嵌入：${label}</span></div>`;
      }
      return `<div class="embed-wrap">
        <div class="embed-caption"><i class="fa-solid fa-window-maximize"></i> 交互页面：${label}</div>
        <iframe class="embed-frame" src="${url}" title="${label}" loading="lazy"></iframe>
        <div class="code-hint">${url}</div>
      </div>`;
    }

    function swipeBlock(demo) {
      const leftBg = demo.leftImg ? `background-image:url('${demo.leftImg}')` : "";
      const rightBg = demo.rightImg ? `background-image:url('${demo.rightImg}')` : "";
      const leftTxt = demo.left || "左侧";
      const rightTxt = demo.right || "右侧";
      return `<div class="swipe-demo" data-swipe>
        <div class="layer-b" style="${rightBg}">${rightTxt}</div>
        <div class="layer-a" id="swipeLayerA" style="${leftBg}">${leftTxt}</div>
        <input type="range" min="0" max="100" value="50" aria-label="卷帘滑块" />
      </div>
      <p style="font-size:0.72rem;color:var(--muted);margin-top:6px">拖动滑块对比两期路网/桥梁实景（左：${leftTxt}，右：${rightTxt}）</p>`;
    }

    function renderStepContent(item) {
      const { chapter, step } = item;
      let html = `
        <span class="step-badge">${step.badge || chapter.title}</span>
        <h2 class="step-title">${step.title}</h2>
        <div class="step-body">${step.body}</div>
      `;
      if (step.meta) html += `<div class="step-meta">${step.meta}</div>`;
      if (step.dataCards) html += dataCardsBlock(step.dataCards);
      if (step.image) html += imageBlock(step.image, step.imageCaption);
      if (step.images) html += galleryBlock(step.images);
      if (step.video) html += videoBlock(step.video);
      if (step.swipeDemo) html += swipeBlock(step.swipeDemo);
      if (step.embedKey) html += embedBlock(step.embedKey, step.embedLabel || step.embedKey);

      el.storyScroll.innerHTML = html;
      el.storyScroll.scrollTop = 0;

      const swipe = el.storyScroll.querySelector("[data-swipe] input[type=range]");
      const layerA = el.storyScroll.querySelector("#swipeLayerA");
      if (swipe && layerA) {
        swipe.addEventListener("input", () => {
          layerA.style.clipPath = `inset(0 ${100 - swipe.value}% 0 0)`;
        });
      }
    }

    function updateTimelineUI(step) {
      const on = !!step.enableTimeline;
      el.timelineBar.classList.toggle("disabled", !on);
      if (step.roadYear) {
        const idx = ROAD_YEARS.indexOf(step.roadYear);
        if (idx >= 0) {
          el.yearSlider.value = idx;
          syncTimelineButtons(idx);
        }
      }
    }

    function syncTimelineButtons(activeIdx) {
      el.timelineYears.querySelectorAll("button").forEach((btn, i) => {
        btn.classList.toggle("active", i === activeIdx);
      });
    }

    function goToFlatIndex(index, options = {}) {
      index = Math.max(0, Math.min(flatSteps.length - 1, index));
      currentFlatIndex = index;
      const item = flatSteps[index];

      renderStepContent(item);
      flyToStep(item.step);
      updateTimelineUI(item.step);

      el.chapterPill.textContent = item.chapter.title;
      el.progressFill.style.width = `${((index + 1) / flatSteps.length) * 100}%`;

      el.btnPrev.disabled = index === 0;
      el.btnNext.disabled = index === flatSteps.length - 1;
      el.btnNext.innerHTML = index === flatSteps.length - 1
        ? "完成 <i class='fa-solid fa-flag-checkered'></i>"
        : "下一步 <i class='fa-solid fa-chevron-right'></i>";

      document.querySelectorAll("#chapterTabs button").forEach((btn) => {
        btn.classList.toggle("active", parseInt(btn.dataset.chapter, 10) === item.chapterIndex);
      });

      if (options.fromTab) {
        /* 章节跳转：落在该章第一步 */
      }
    }

    function buildChapterTabs() {
      STORY.forEach((ch, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = ch.title;
        btn.dataset.chapter = i;
        btn.addEventListener("click", () => {
          const first = flatSteps.findIndex((f) => f.chapterIndex === i);
          if (first >= 0) goToFlatIndex(first, { fromTab: true });
        });
        el.chapterTabs.appendChild(btn);
      });
    }

    function buildTimeline() {
      ROAD_YEARS.forEach((y, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = y;
        btn.addEventListener("click", () => {
          el.yearSlider.value = i;
          syncTimelineButtons(i);
          renderHighwaysByYear(y);
          if (layerVisible.roads) roadLayer.addTo(map);
          const item = flatSteps[currentFlatIndex];
          if (item && item.step.enableTimeline) item.step.roadYear = y;
        });
        el.timelineYears.appendChild(btn);
      });

      el.yearSlider.addEventListener("input", () => {
        const i = parseInt(el.yearSlider.value, 10);
        syncTimelineButtons(i);
        renderHighwaysByYear(ROAD_YEARS[i]);
        if (layerVisible.roads) roadLayer.addTo(map);
        const item = flatSteps[currentFlatIndex];
        if (item && item.step.enableTimeline) item.step.roadYear = ROAD_YEARS[i];
      });
    }

    function bindControls() {
      el.btnStart.addEventListener("click", () => {
        el.cover.classList.add("hidden");
        goToFlatIndex(0);
      });

      el.btnPrev.addEventListener("click", () => goToFlatIndex(currentFlatIndex - 1));
      el.btnNext.addEventListener("click", () => {
        if (currentFlatIndex < flatSteps.length - 1) goToFlatIndex(currentFlatIndex + 1);
      });

      el.basemapSelect.addEventListener("change", (e) => setBasemap(e.target.value));

      el.btnFitGuizhou.addEventListener("click", () => {
        map.flyToBounds(CONFIG.guizhouBounds, { padding: [30, 30], duration: 1 });
      });

      el.chkBridges.addEventListener("change", (e) => {
        layerVisible.bridges = e.target.checked;
        syncOverlayLayers();
        applyMapLayers(flatSteps[currentFlatIndex].step);
      });
      el.chkRoads.addEventListener("change", (e) => {
        layerVisible.roads = e.target.checked;
        syncOverlayLayers();
      });
      el.chkRegions.addEventListener("change", (e) => {
        layerVisible.regions = e.target.checked;
        syncOverlayLayers();
        applyMapLayers(flatSteps[currentFlatIndex].step);
      });

      document.addEventListener("keydown", (e) => {
        if (el.cover.classList.contains("hidden") === false) return;
        if (e.key === "ArrowRight" || e.key === " ") {
          e.preventDefault();
          if (currentFlatIndex < flatSteps.length - 1) goToFlatIndex(currentFlatIndex + 1);
        }
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          goToFlatIndex(currentFlatIndex - 1);
        }
      });
    }

    function init() {
      applyCoverBackground();
      initMap();
      buildChapterTabs();
      buildTimeline();
      bindControls();
      bridgeLayer.removeFrom(map);
      regionLayer.removeFrom(map);
      roadLayer.removeFrom(map);
      renderStepContent(flatSteps[0]);
      el.progressFill.style.width = `${(1 / flatSteps.length) * 100}%`;
    }

    init();
  </script>
</body>
</html>
