<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>第四章 · 双桥故事（高度与温度）· 贵州桥梁时空地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <style>
    :root {
      --bg-deep: #2a3540;
      --bg-panel: #f4f1eb;
      --steel: #5c6d7e;
      --steel-dark: #3d4f5f;
      --river: #3d7a9b;
      --river-light: #5a9fc4;
      --rust: #b85c38;
      --rust-light: #d4845c;
      --concrete: #e8e4dc;
      --accent: #41b7a6;
      --text: #2c3338;
      --muted: #5c6570;
      --green: #2ecc71;
      --green-bright: #27ae60;
      --orange: #f29b55;
      --blue: #233bc8;
      --red: #e74c3c;
      --gray: #95a5a6;
      --header-h: 52px;
      --panel-w: min(400px, 36vw);
      --shadow: 0 8px 28px rgba(26, 35, 45, 0.16);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --map-dock-left: 12px;
      --map-dock-bottom: 12px;
      --map-dock-width: 200px;
      --map-dock-overview-h: 180px;
      --map-dock-tools-h: 40px;
      --map-dock-gap: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
      overflow: hidden;
      background: var(--bg-deep);
      color: var(--text);
    }

    #pageHeader {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-h);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: linear-gradient(90deg, var(--steel-dark), var(--steel));
      color: #fff;
      border-bottom: 2px solid var(--rust);
      pointer-events: none;
    }

    #pageHeader > * { pointer-events: auto; }

    #pageHeader h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    #pageHeader p {
      font-size: 0.72rem;
      opacity: 0.88;
      margin-top: 2px;
    }

    .header-tools {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-tools select {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.12);
      color: #fff;
      font-size: 0.78rem;
      cursor: pointer;
    }

    .header-tools select option { color: #222; }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      padding-top: var(--header-h);
    }

    #appMain {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    #mapWrap {
      flex: 1;
      position: relative;
      min-width: 0;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #dce4e8;
    }

    .map-badge {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 6px 16px;
      background: rgba(244, 241, 235, 0.96);
      border: 1px solid var(--steel);
      border-radius: 20px;
      font-size: 0.72rem;
      color: var(--steel-dark);
      box-shadow: var(--shadow);
      pointer-events: none;
      transition: opacity 0.4s var(--ease);
      white-space: nowrap;
    }

    .map-badge strong { color: var(--rust); }

    .map-coord-bar {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      max-width: calc(100% - 200px);
      padding: 6px 14px;
      background: rgba(244, 241, 235, 0.96);
      border: 1px solid var(--steel);
      border-radius: 18px;
      font-size: 0.74rem;
      color: var(--steel-dark);
      box-shadow: var(--shadow);
      pointer-events: none;
      white-space: nowrap;
    }

    .map-coord-bar .coord-val {
      color: var(--rust);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .map-top-left-dock {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: min(280px, 42vw);
    }

    .map-zoom-slot {
      display: flex;
      flex-direction: column;
      align-self: flex-start;
      width: fit-content;
      background: rgba(244, 241, 235, 0.96);
      border: 1px solid rgba(92, 109, 126, 0.45);
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(26, 35, 45, 0.14);
      overflow: hidden;
    }

    .route-mode-toggle {
      display: none;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .route-mode-toggle.visible { display: flex; }

    .route-mode-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border: 1px solid rgba(92, 109, 126, 0.45);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--steel-dark);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 4px 14px rgba(26, 35, 45, 0.12);
      transition: background 0.25s var(--ease), border-color 0.25s var(--ease), transform 0.2s var(--ease);
    }

    .route-mode-btn:hover {
      background: #fff;
      border-color: var(--river);
      transform: translateY(-1px);
    }

    .route-mode-btn.active[data-mode="ancient"] {
      background: rgba(255, 248, 245, 0.98);
      border-color: var(--red);
      box-shadow: 0 0 0 2px rgba(231, 76, 60, 0.25);
      color: #c0392b;
    }

    .route-mode-btn.active[data-mode="modern"] {
      background: rgba(240, 252, 248, 0.98);
      border-color: var(--green);
      box-shadow: 0 0 0 2px rgba(46, 204, 113, 0.35);
      color: #1e8449;
    }

    .map-zoom-slot button {
      width: 32px;
      height: 32px;
      border: none;
      background: #fff;
      border-bottom: 1px solid #d0d6dc;
      cursor: pointer;
      font-size: 1rem;
      color: var(--steel-dark);
      transition: background 0.2s, color 0.2s;
    }

    .map-zoom-slot button:last-child { border-bottom: none; }
    .map-zoom-slot button:hover { background: var(--river); color: #fff; }

    .region-toggle {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .region-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border: 1px solid rgba(92, 109, 126, 0.45);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--steel-dark);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      box-shadow: 0 4px 14px rgba(26, 35, 45, 0.12);
      transition: background 0.25s var(--ease), border-color 0.25s var(--ease), transform 0.2s var(--ease);
    }

    .region-btn:hover {
      background: #fff;
      border-color: var(--river);
      transform: translateY(-1px);
    }

    .region-btn.active[data-region="huajiang"] {
      background: rgba(240, 252, 248, 0.98);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(65, 183, 166, 0.35);
      color: #2a7a6e;
    }

    .region-btn.active[data-region="dushan"] {
      background: rgba(255, 248, 245, 0.98);
      border-color: var(--orange);
      box-shadow: 0 0 0 2px rgba(242, 155, 85, 0.35);
      color: #c07030;
    }

    .region-btn.active[data-region="beipan"],
    .region-btn.active[data-region="yachi"],
    .region-btn.active[data-region="baling"] {
      background: rgba(240, 252, 248, 0.98);
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(65, 183, 166, 0.35);
      color: #2a7a6e;
    }

    .region-btn.active[data-region="leishanSchool"],
    .region-btn.active[data-region="congjiangHealth"] {
      background: rgba(255, 248, 245, 0.98);
      border-color: var(--orange);
      box-shadow: 0 0 0 2px rgba(242, 155, 85, 0.35);
      color: #c07030;
    }

    .map-corner-dock {
      position: absolute;
      left: var(--map-dock-left);
      bottom: var(--map-dock-bottom);
      z-index: 1000;
      width: var(--map-dock-width);
      display: flex;
      flex-direction: column;
      gap: var(--map-dock-gap);
      pointer-events: none;
    }

    .map-corner-dock > * { pointer-events: auto; }

    .overview-map-wrap {
      width: 100%;
      height: var(--map-dock-overview-h);
      display: flex;
      flex-direction: column;
      background: rgba(244, 241, 235, 0.92);
      border: 1px solid rgba(92, 109, 126, 0.5);
      border-radius: 8px;
      box-shadow: 0 6px 22px rgba(26, 35, 45, 0.22);
      overflow: hidden;
    }

    .overview-map-head {
      flex-shrink: 0;
      padding: 5px 10px;
      font-size: 0.68rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(90deg, var(--steel-dark), var(--steel));
      letter-spacing: 0.06em;
    }

    #overviewMap {
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .map-scale-home-dock {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 1000;
      display: flex;
      align-items: stretch;
      background: rgba(244, 241, 235, 0.96);
      border: 1px solid rgba(92, 109, 126, 0.42);
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(26, 35, 45, 0.18);
      overflow: hidden;
      pointer-events: auto;
    }

    .scale-bar-widget {
      display: flex;
      align-items: center;
      padding: 8px 14px 10px;
      min-width: 88px;
    }

    .scale-bar-line {
      position: relative;
      padding: 0 10px 7px;
      border-bottom: 2px solid #4a5568;
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--steel-dark);
      white-space: nowrap;
      line-height: 1;
    }

    .scale-bar-line::before,
    .scale-bar-line::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 2px;
      height: 9px;
      background: #4a5568;
    }

    .scale-bar-line::before { left: 0; }
    .scale-bar-line::after { right: 0; }

    .btn-map-home {
      flex-shrink: 0;
      width: 40px;
      min-height: 40px;
      border: none;
      border-left: 1px solid rgba(92, 109, 126, 0.35);
      border-radius: 0;
      background: #fff;
      cursor: pointer;
      color: var(--steel-dark);
      font-size: 0.95rem;
      transition: background 0.2s, color 0.2s;
    }

    .btn-map-home:hover {
      background: var(--river);
      color: #fff;
    }

    .map-attribution {
      position: absolute;
      left: calc(var(--map-dock-width) + var(--map-dock-left) + 16px);
      right: 12px;
      bottom: 4px;
      z-index: 998;
      text-align: center;
      font-size: 0.62rem;
      line-height: 1.4;
      color: rgba(44, 51, 56, 0.82);
      background: rgba(244, 241, 235, 0.88);
      padding: 4px 10px;
      border-radius: 4px;
      pointer-events: none;
    }

    .map-legend-panel {
      position: absolute;
      right: 12px;
      top: 52px;
      z-index: 1000;
      max-width: min(200px, 32vw);
      width: min(200px, 32vw);
      padding: 10px 12px;
      background: rgba(244, 241, 235, 0.96);
      border: 1px solid var(--steel);
      border-radius: 8px;
      font-size: 0.68rem;
      line-height: 1.55;
      box-shadow: var(--shadow);
    }

    .map-legend-panel h4 {
      font-size: 0.72rem;
      margin-bottom: 6px;
      color: var(--steel-dark);
    }

    .lg-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .lg-swatch { width: 18px; height: 4px; border-radius: 2px; flex-shrink: 0; }

    #fxCanvas {
      position: absolute;
      inset: 0;
      z-index: 450;
      pointer-events: none;
    }

    .anim-timer-hud {
      position: absolute;
      top: 52px;
      right: calc(12px + min(200px, 32vw) + 14px);
      z-index: 1001;
      max-width: min(220px, 38vw);
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(92, 109, 126, 0.4);
      border-radius: 8px;
      font-size: 0.72rem;
      color: var(--steel-dark);
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
      pointer-events: none;
    }

    .anim-timer-hud.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .anim-timer-hud strong { color: var(--rust); font-variant-numeric: tabular-nums; }

    .height-ruler-icon {
      width: 36px;
      height: 110px;
      position: relative;
      pointer-events: none;
    }

    .height-ruler-icon .ruler-track {
      position: absolute;
      left: 50%;
      top: 0;
      width: 6px;
      height: 100%;
      margin-left: -3px;
      background: rgba(61, 79, 95, 0.15);
      border-radius: 3px;
      overflow: hidden;
    }

    .height-ruler-icon .ruler-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0;
      background: linear-gradient(180deg, #5a9fc4, var(--accent));
      animation: rulerFill 3s ease-in-out infinite;
    }

  @keyframes rulerFill {
      0%, 100% { height: 0; }
      50% { height: 100%; }
    }

    .height-ruler-icon .ruler-label {
      position: absolute;
      left: 110%;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--steel-dark);
      background: rgba(255,255,255,0.92);
      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .waterfall-fx {
      width: 48px;
      height: 90px;
      position: relative;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.75;
    }

    .waterfall-fx span {
      position: absolute;
      left: 50%;
      width: 3px;
      height: 14px;
      margin-left: -1.5px;
      background: linear-gradient(180deg, rgba(90,159,196,0.9), rgba(65,183,166,0.2));
      border-radius: 2px;
      animation: waterDrop 1.2s linear infinite;
    }

    .waterfall-fx span:nth-child(1) { animation-delay: 0s; left: 35%; }
    .waterfall-fx span:nth-child(2) { animation-delay: 0.3s; left: 50%; }
    .waterfall-fx span:nth-child(3) { animation-delay: 0.6s; left: 65%; }

    @keyframes waterDrop {
      0% { top: -14px; opacity: 0; }
      20% { opacity: 1; }
      100% { top: 90px; opacity: 0; }
    }

    .crack-fx {
      font-size: 1.1rem;
      animation: crackFlash 1.1s ease-in-out infinite;
      filter: drop-shadow(0 0 4px rgba(231,76,60,0.6));
    }

    @keyframes crackFlash {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .bridge-glow-fx {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(39,174,96,0.85), rgba(39,174,96,0.05));
      animation: bridgeGlow 2s ease-in-out infinite;
    }

    @keyframes bridgeGlow {
      0%, 100% { transform: scale(0.85); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    .warm-dot-fx {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f9e79f;
      box-shadow: 0 0 8px #f5b7b1;
      animation: warmPulse 1.6s ease-in-out infinite;
    }

    @keyframes warmPulse {
      0%, 100% { transform: scale(0.8); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
    }

    .person-shake .icon-person { animation: personShake 0.35s ease-in-out infinite; }

    .marker-pulse { animation: markerPulse 0.6s ease-in-out 3; }

    @keyframes markerPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 transparent); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 6px rgba(242, 155, 85, 0.8)); }
    }

    @keyframes personShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-2px); }
      75% { transform: translateX(2px); }
    }

    .person-smile .icon-person::after {
      content: "😊";
      position: absolute;
      right: -10px;
      top: -6px;
      font-size: 0.55rem;
    }

    .pulse-ring {
      animation: pulseRing 2.8s ease-out infinite;
    }

    @keyframes pulseRing {
      0% { stroke-opacity: 0.7; fill-opacity: 0.12; }
      70% { stroke-opacity: 0.2; fill-opacity: 0.04; }
      100% { stroke-opacity: 0.7; fill-opacity: 0.12; }
    }

    .story-typing-line {
      opacity: 0;
      transform: translateY(8px);
      animation: typingFadeIn 0.8s var(--ease) forwards;
    }

    .story-typing-line.delay-1 { animation-delay: 0.4s; }
    .story-typing-line.delay-2 { animation-delay: 1.2s; }

    @keyframes typingFadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .counter-roll { font-variant-numeric: tabular-nums; }

    .coord-note-inline {
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    #mapWrap .leaflet-control-zoom { display: none; }
    #overviewMap .leaflet-control-attribution { display: none !important; }

    .route-dash-flow { animation: dashFlow 1.8s linear infinite; }
    @keyframes dashFlow { to { stroke-dashoffset: -36; } }

    .leaflet-popup-content-wrapper {
      border-radius: 8px;
      box-shadow: var(--shadow);
      border: 1px solid var(--steel);
    }

    .leaflet-popup-content {
      margin: 10px 12px;
      font-size: 0.8rem;
      line-height: 1.55;
      min-width: 180px;
    }

    .popup-title { font-weight: 700; color: var(--steel-dark); margin-bottom: 6px; font-size: 0.88rem; }
    .popup-title.height { color: var(--accent); }
    .popup-title.warm { color: var(--orange); }

    .leaflet-popup.popup-has-img .leaflet-popup-content-wrapper { max-width: 300px; }
    .leaflet-popup.popup-has-img .leaflet-popup-content { min-width: 220px; max-width: 280px; margin: 8px 10px; }
    .popup-media { margin: 0 0 8px; border-radius: 6px; overflow: hidden; line-height: 0; }
    .popup-img { display: block; width: 100%; height: auto; max-height: 132px; object-fit: cover; }
    .popup-text { line-height: 1.55; }

    .typing-lines { margin-top: 14px; }
    .typing-line-gradient {
      margin: 0;
      padding: 10px 12px;
      border-radius: 8px;
      background: linear-gradient(135deg, rgba(65, 183, 166, 0.12), rgba(46, 204, 113, 0.08));
      border-left: 3px solid var(--accent);
      font-size: 0.92rem;
      line-height: 1.65;
      white-space: normal;
    }
    .typing-line-gradient strong {
      font-weight: 700;
      background: linear-gradient(90deg, #1e8449 0%, #27ae60 35%, #41b7a6 70%, #2ecc71 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }

    .custom-marker { background: transparent !important; border: none !important; }

    .icon-pin {
      width: 18px; height: 18px;
      display: flex; align-items: center; justify-content: center;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.35));
      line-height: 1;
    }

    .icon-car, .icon-person, .icon-glow {
      font-size: 1rem;
      filter: drop-shadow(0 1px 4px rgba(0,0,0,0.35));
      line-height: 1;
    }

    /* ========== 叙事侧栏（与 test_2 一致） ========== */
    #storyPanel {
      width: var(--panel-w);
      min-width: 320px;
      flex-shrink: 0;
      background: var(--bg-panel);
      border-left: 1px solid #c5cdd6;
      display: flex;
      flex-direction: column;
      z-index: 150;
      box-shadow: var(--shadow);
    }

    .progress-track { height: 4px; background: #d8dde3; }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--river), var(--accent));
      transition: width 0.55s var(--ease);
    }

    .step-nav-wrap {
      flex-shrink: 0;
      background: #faf9f7;
      border-bottom: 1px solid #d0d6dc;
      position: relative;
    }

    .step-nav-wrap::after {
      content: "";
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 28px;
      background: linear-gradient(90deg, transparent, #faf9f7);
      pointer-events: none;
      z-index: 1;
    }

    #stepNav {
      display: flex;
      flex-wrap: nowrap;
      padding: 12px 14px 8px;
      gap: 6px;
      width: 100%;
      box-sizing: border-box;
    }

    .step-pill {
      flex: 1 1 0;
      min-width: 0;
      border: 1px solid #d0d6dc;
      background: #fff;
      border-radius: 8px;
      padding: 8px 6px;
      cursor: pointer;
      transition: all 0.3s var(--ease);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

  function zoomForScaleBarKm(lat, km) {
    var metersPerPixel = (km * 1000) / SCALE_BAR_PX;
    var zoom = Math.log2(156543.03392 * Math.cos(lat * Math.PI / 180) / metersPerPixel);
    return Math.max(7, Math.min(22, Math.round(zoom * 100) / 100));
  }

  function getDushanViewCenter() {
    var lats = [], lngs = [];
    villagerPath.forEach(function (p) { lats.push(p[0]); lngs.push(p[1]); });

      lats.push(p[0]); lngs.push(p[1]);
    });
    return [
      (Math.min.apply(null, lats) + Math.max.apply(null, lats)) / 2,
      (Math.min.apply(null, lngs) + Math.max.apply(null, lngs)) / 2
    ];
  }

  function runCounterAnims() {
    el.storyBody.querySelectorAll(".counter-roll").forEach(function (node) {
      var target = parseInt(node.getAttribute("data-counter"), 10);
      var startTs = null;
      function frame(ts) {
        if (!startTs) startTs = ts;
        var p = Math.min(1, (ts - startTs) / 1500);
        var val = Math.floor(target * p);
        if (target >= 1000000) node.textContent = Math.floor(val / 10000) + "万";
        else if (target >= 10000) node.textContent = (val / 10000).toFixed(1).replace(/\.0$/, "") + "万+";
        else node.textContent = String(val);
        if (p < 1) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    });
  }

  function hideAllBigBridgeLines() {
    BIG_BRIDGE_KEYS.forEach(function (key) {
      var lines = bridgeRouteLines[key];
      if (!lines) return;
      if (lines.oldLine && layers.routes.hasLayer(lines.oldLine)) layers.routes.removeLayer(lines.oldLine);
      if (lines.newLine && layers.routes.hasLayer(lines.newLine)) layers.routes.removeLayer(lines.newLine);
    });
  }

  function showBigBridgeLines(key, isAncient) {
    hideAllBigBridgeLines();
    var lines = bridgeRouteLines[key];
    if (!lines) return;
    var active = isAncient ? lines.oldLine : lines.newLine;
    var inactive = isAncient ? lines.newLine : lines.oldLine;
    if (active && !layers.routes.hasLayer(active)) layers.routes.addLayer(active);
    if (inactive && layers.routes.hasLayer(inactive)) layers.routes.removeLayer(inactive);
    if (lines.oldLine) lines.oldLine.setStyle({ opacity: isAncient ? 1 : 0.35, weight: isAncient ? 5 : 3 });
    if (lines.newLine) lines.newLine.setStyle({ opacity: isAncient ? 0.35 : 1, weight: isAncient ? 3 : 5 });
  }

  function showWarmBridgeLines(key, isAncient) {

  function formatTimer(sec) {
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  function stopRouteTimer() {
    if (timerRafId) { cancelAnimationFrame(timerRafId); timerRafId = null; }
    if (el.animTimerHud) el.animTimerHud.classList.remove("visible");
  }

  function startRouteTimer(totalSec, label) {
    stopRouteTimer();
    if (!el.animTimerHud) return;
    el.animTimerLabel.textContent = label;
    el.animTimerHud.classList.add("visible");
    var startTs = null;
    function frame(ts) {
      if (!startTs) startTs = ts;
      el.animTimerValue.textContent = formatTimer(((ts - startTs) / 1000) % (totalSec + 0.001));
      timerRafId = requestAnimationFrame(frame);
    }
    timerRafId = requestAnimationFrame(frame);
  }

  function startPulseRings() {
    if (pulseRafId) cancelAnimationFrame(pulseRafId);
    var startTs = null;
    function frame(ts) {
      if (!startTs) startTs = ts;
      var t = ((ts - startTs) % 2800) / 2800;
      pulseCircles.forEach(function (circle, i) {
        circle.setRadius((i === 0 ? 5000 : 10000) * (0.85 + t * 0.3));
      });
      pulseRafId = requestAnimationFrame(frame);
    }
    pulseRafId = requestAnimationFrame(frame);
  }

  function stopPulseRings() {
    if (pulseRafId) { cancelAnimationFrame(pulseRafId); pulseRafId = null; }
    pulseCircles.forEach(function (circle, i) { circle.setRadius(i === 0 ? 5000 : 10000); });
  }

  function stopStoryFx() {
    stopPulseRings();

    setFxLayerVisible(false);
  }

  function playBigBridgeFx(key) {

    hideAllWarmBridgeLines();
    hideAllWarmBridgeMarkers();
    setPulseRingsAt(story.center || LOC[key] || LOC.bridge);
    showBigBridgeLines(key, routeMode === "ancient");
    updateFxVisibility();
    if (markers[key]) highlightMarker(markers[key]);
    startPulseRings();
    var isAncient = routeMode === "ancient";
    startRouteTimer(isAncient ? story.timerAncient : story.timerModern, isAncient ? story.timerAncientLabel : story.timerModernLabel);
    startAllAnimations();
  }

  function playWarmBridgeFx(key) {
    if (!WARM_BRIDGE_STORIES[key]) key = "dushan";
    activeMapStory = key;
    hideAllBigBridgeLines();
    var isAncient = routeMode === "ancient";
    showWarmBridgeLines(key, isAncient);
    updateWarmBridgeMarkers(key, isAncient);
    updateFxVisibility();
    if (key === "dushan") {
      if (isAncient) {
        highlightMarker(markers.gaoqiaoDanger);
        highlightMarker(markers.tiaodengDanger);
      } else highlightMarker(markers.newBridgeOk);
      highlightMarker(markers.dushan);
    } else if (markers[key]) {
      highlightMarker(markers[key]);
      if (key === "leishanSchool" && isAncient) highlightMarker(markers.leishanOldDanger);
      else if (key === "leishanSchool" && !isAncient) highlightMarker(markers.leishanNewOk);
      if (key === "congjiangHealth" && isAncient) highlightMarker(markers.congjiangOldDanger);
      else if (key === "congjiangHealth" && !isAncient) highlightMarker(markers.congjiangNewOk);
    }

  function renderStoryHtml(step) {
    var html = '<div class="story-block">';
    html += '<div class="step-badge">' + step.badge + '</div>';
    html += '<h2 class="step-title">' + step.title + '</h2>';
    if (step.cards && step.cards.length) {
      html += '<div class="data-cards">';
      step.cards.forEach(function (c) {
        var val = c.value;
        if (c.counter) val = '<span class="counter-roll" data-counter="' + c.counter + '">0</span>';
        html += '<div class="data-card' + (c.warn ? ' warn' : '') + '"><strong>' + val + '</strong><span>' + c.label + '</span></div>';
      });
      html += '</div>';
    }
    if (step.body && step.body.length) {
      html += '<div class="step-text">' + step.body.join("") + '</div>';
    }
    if (step.highlight) {
      html += '<div class="story-data-highlight">' + step.highlight + '</div>';
    }
    if (step.typingLines && step.typingLines.length) {
      html += '<div class="typing-lines"><p class="typing-line-gradient"><strong>' + step.typingLines.join(" ") + '</strong></p></div>';
    }
    if (step.meta) {
      html += '<div class="step-meta' + (step.metaClass ? ' ' + step.metaClass : '') + '">' + step.meta + '</div>';
    }
    html += '</div>';
    return html;
  }

  function buildStepNav() {
    STEPS.forEach(function (step, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "step-pill" + (i === 0 ? " active" : "");

  function paintStoryPanel(step, index) {
    el.storyBody.classList.remove("is-initial");
    var subs = getSubStoriesForStep(step);
    if (subs && subs.length) {
      if (subStoryIndex >= subs.length) subStoryIndex = 0;
      paintSubStoryPanel(subs[subStoryIndex], step);
    } else {
      hideSubStoryControls();
      el.storyBody.innerHTML = renderStoryHtml(step);
      requestAnimationFrame(function () {
        var block = el.storyBody.querySelector(".story-block");
        if (block) block.classList.add("visible");
        bindMapJumps();
        runCounterAnims();
      });
    }

    el.btnNext.disabled = index === STEPS.length - 1;

  function regionForStoryKey(key) {
    return key === "bridge" ? "huajiang" : key;

  function getSubStoriesForStep(step) {
    if (!step) return null;
    return SUB_STORIES[step.id] || null;
  }
  function findSubStoryIndex(stepId, key) {
    var list = SUB_STORIES[stepId];
    if (!list) return 0;
    for (var i = 0; i < list.length; i++) {
      if (list[i].key === key) return i;
    }
    return 0;

  function paintSubStoryPanel(sub, step) {

  function updateSubStoryControls(subs, index) {
    if (!el.subStoryControls || !subs) return;
    el.subStoryControls.classList.add("visible");
    el.subStoryControls.classList.toggle("warm-theme", STEPS[currentIndex] && STEPS[currentIndex].id === "story2");
    el.btnSubStoryPrev.disabled = index <= 0;

  }
  function goToSubStory(newIndex) {
    var step = STEPS[currentIndex];
    var subs = getSubStoriesForStep(step);
    if (!subs) return;
    newIndex = Math.max(0, Math.min(subs.length - 1, newIndex));
    if (newIndex === subStoryIndex) return;
    subStoryIndex = newIndex;
    paintSubStoryPanel(subs[subStoryIndex], step);
    setRegionButtons(regionForStoryKey(subs[subStoryIndex].key));
    flyToTarget(subs[subStoryIndex].key, true);
  }
  function goToRegionStory(region) {
    if (region === "all") {
      goToStep(2);
      return;
    }
    var cfg = REGION_STORY_MAP[region];
    if (!cfg) return;
    var step = STEPS[cfg.step];
    var subs = SUB_STORIES[step.id];
    var storyKey = subs[cfg.sub].key;
    if (cfg.step === currentIndex && cfg.sub === subStoryIndex) {
      setRegionButtons(region);
      flyToTarget(storyKey, true);
      return;
    }
    currentIndex = cfg.step;
    subStoryIndex = cfg.sub;
    paintStoryPanel(step, cfg.step);
    updateRouteModeVisibility(step);
    setRegionButtons(region);
    setTimeout(function () {
      flyToTarget(storyKey, true);
    }, 1250);
  }
  function goToStep(index) {
    index = Math.max(0, Math.min(STEPS.length - 1, index));
    var step = STEPS[index];
    var changed = index !== currentIndex;
    currentIndex = index;
    if (changed) subStoryIndex = 0;
    if (changed) paintStoryPanel(step, index);
    else updateRouteModeVisibility(step);
    var subs = getSubStoriesForStep(step);
    if (subs && subs[subStoryIndex]) {
      setTimeout(function () {
        flyToTarget(subs[subStoryIndex].key, true);
      }, 1250);

  function applyBasemap(key) {

      if (map.hasLayer(baseLayers[k])) map.removeLayer(baseLayers[k]);
    });
    if (key === "terrain-relief") baseLayers.terrain.addTo(map);
    else baseLayers.streets.addTo(map);

      Object.keys(overviewBaseLayers).forEach(function (k) {

  function loadBoundaryLayers() {
    if (typeof L.esri === "undefined" || !L.esri.featureLayer) return;

      bridgeGlow: makeBridgeGlowFx(LOC.leishanSchool)
    };
    fxMarkers.congjiangHealth = {
      crackMarkers: [makeCrackFx(LOC.congjiangOldFord)],
      bridgeGlow: makeBridgeGlowFx(LOC.congjiangHealth)
    };
    warmDotMarkersByStory = {
      dushan: makeWarmDots(villagerPath),
      leishanSchool: makeWarmDots(leishanPath),
      congjiangHealth: makeWarmDots(congjiangPath)
    };
    warmDotMarkers = warmDotMarkersByStory.dushan;
    if (el.fxCanvas) {
      fxCtx = el.fxCanvas.getContext("2d");
      resizeFxCanvas();
    }

    map.on("mousemove", function (e) {
      el.coordLon.textContent = e.latlng.lng.toFixed(5);
      el.coordLat.textContent = e.latlng.lat.toFixed(5);
    });
    map.on("moveend zoomend", updateOverviewRect);
    map.on("zoomend moveend", updateScaleText);

    initOverviewMap();
    loadBoundaryLayers();

  }

  function initOverviewMap() {
    overviewMap = L.map("overviewMap", {
      zoomControl: false, attributionControl: false,
      dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false
    });
    overviewBaseLayers.streets = L.tileLayer(AGOL + "World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 10 });
    overviewBaseLayers.topo = L.tileLayer(AGOL + "World_Topo_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom: 10 });
    overviewBaseLayers.hillshade = L.tileLayer(AGOL + "Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}", { maxZoom: 10, opacity: 0.58 });
    overviewBaseLayers.terrain = L.layerGroup([overviewBaseLayers.topo, overviewBaseLayers.hillshade]);
    overviewBaseLayers.streets.addTo(overviewMap);
    overviewMap.fitBounds(GUIZHOU_BOUNDS);
    overviewRect = L.rectangle(map.getBounds(), {
      color: "#b85c38", weight: 2, fillOpacity: 0.08, interactive: false
    }).addTo(overviewMap);
    updateOverviewRect();
    updateScaleText();
  }

  function updateOverviewRect() {
    if (!overviewRect) return;
    overviewRect.setBounds(map.getBounds());
  }

  function updateScaleText() {
    if (!map || !el.scaleLabel) return;
    var midY = map.getSize().y / 2;
    var x1 = map.containerPointToLatLng([0, midY]);
    var x2 = map.containerPointToLatLng([80, midY]);
    var meters = map.distance(x1, x2);
    var label;
    if (meters >= 10000) label = Math.round(meters / 1000) + "公里";
    else if (meters >= 1000) label = (meters / 1000).toFixed(1).replace(/\.0$/, "") + "公里";
    else label = Math.round(meters) + "米";
    el.scaleLabel.textContent = label;
  }

  function resizeFxCanvas() {
    if (!el.fxCanvas) return;
    var rect = el.fxCanvas.parentElement.getBoundingClientRect();
    el.fxCanvas.width = rect.width;
    el.fxCanvas.height = rect.height;
    if (!fxCtx) fxCtx = el.fxCanvas.getContext("2d");
    if (fxCtx) fxCtx.clearRect(0, 0, el.fxCanvas.width, el.fxCanvas.height);
  }

  function drawWarmPathCanvas() {
    /* 温情路径已改为 Leaflet 折线 warmPathLine，随地图平移缩放 */
  }

  function latLngAtProgress(latlngs, t) {
    if (t <= 0) return latlngs[0];
    if (t >= 1) return latlngs[latlngs.length - 1];
    var segs = [], total = 0;
    for (var i = 0; i < latlngs.length - 1; i++) {
      var a = L.latLng(latlngs[i]), b = L.latLng(latlngs[i + 1]), d = a.distanceTo(b);
      segs.push({ a: a, b: b, d: d, start: total });
      total += d;
    }
    var dist = t * total;
    for (var j = 0; j < segs.length; j++) {
      if (dist <= segs[j].start + segs[j].d) {
        var local = (dist - segs[j].start) / segs[j].d;
        return L.latLng(
          segs[j].a.lat + (segs[j].b.lat - segs[j].a.lat) * local,
          segs[j].a.lng + (segs[j].b.lng - segs[j].a.lng) * local
        );
      }
    }
    return latlngs[latlngs.length - 1];
  }

  function cancelAnim(id) {
    if (animRafIds[id]) { cancelAnimationFrame(animRafIds[id]); animRafIds[id] = null; }
  }

  function runLoopAnim(id, marker, latlngs, durationMs, progressFn) {
    cancelAnim(id);
    var startTs = null;
    function frame(ts) {
      if (!startTs) startTs = ts;
      var t = ((ts - startTs) % durationMs) / durationMs;
      marker.setLatLng(latLngAtProgress(latlngs, progressFn ? progressFn(t) : t));
      animRafIds[id] = requestAnimationFrame(frame);
    }
    animRafIds[id] = requestAnimationFrame(frame);
  }

  function hesitantProgress(t) {
    var pauses = [[0.28, 0.34], [0.58, 0.66]], scale = 0.72;
    for (var i = 0; i < pauses.length; i++) {
      if (t >= pauses[i][0] && t <= pauses[i][1]) return pauses[i][0] * scale;
    }
    var adj = t;
    pauses.forEach(function (p) { if (t > p[1]) adj -= (p[1] - p[0]) * 0.35; });
    return Math.min(1, adj * scale);
  }

  function setAnimVisible(marker, show) {
    var elmk = marker.getElement();
    if (elmk) elmk.style.display = show ? "block" : "none";
  }

  function updateWarmPathAnim(storyKey) {
    cancelAnim("personH");
    cancelAnim("personS");
    var story = WARM_BRIDGE_STORIES[storyKey];
    if (!story || activeMapStory !== storyKey || currentIndex !== 1) return;
    var path = story.path;
    var isAncient = routeMode === "ancient";
    var hEl = animMarkers.personHesitant.getElement();
    var sEl = animMarkers.personSmooth.getElement();
    if (hEl) hEl.classList.toggle("person-shake", isAncient);
    if (sEl) sEl.classList.toggle("person-smile", !isAncient);
    if (isAncient) {
      setAnimVisible(animMarkers.personSmooth, false);
      setAnimVisible(animMarkers.personHesitant, true);
      runLoopAnim("personH", animMarkers.personHesitant, path, 18000, hesitantProgress);
    } else {
      setAnimVisible(animMarkers.personHesitant, false);
      setAnimVisible(animMarkers.personSmooth, true);
      runLoopAnim("personS", animMarkers.personSmooth, path, 9000, function (t) { return t; });
    }
  }

  function updateDushanPathAnim() { updateWarmPathAnim("dushan"); }

  function startAllAnimations() {
    cancelAnim("slow");
    cancelAnim("car");
    var isAncient = routeMode === "ancient";
    var bigStory = isBigBridgeKey(activeMapStory) ? BIG_BRIDGE_STORIES[activeMapStory] : null;
    if (bigStory && currentIndex === 0) {
      var path = isAncient ? bigStory.oldRoad : bigStory.newRoad;
      if (isAncient) {
        setAnimVisible(animMarkers.car, false);
        setAnimVisible(animMarkers.slowDot, true);
        runLoopAnim("slow", animMarkers.slowDot, path, 18000, function (t) { return t; });
      } else {
        setAnimVisible(animMarkers.slowDot, false);
        setAnimVisible(animMarkers.car, true);
        runLoopAnim("car", animMarkers.car, path, 6500, function (t) { return t; });
      }
      showBigBridgeLines(activeMapStory, isAncient);
    } else {
      setAnimVisible(animMarkers.slowDot, false);
      setAnimVisible(animMarkers.car, false);
    }
    if (isWarmBridgeKey(activeMapStory) && currentIndex === 1) {
      showWarmBridgeLines(activeMapStory, isAncient);
      updateWarmPathAnim(activeMapStory);
    } else {
      setAnimVisible(animMarkers.personHesitant, false);
      setAnimVisible(animMarkers.personSmooth, false);
    }
    runLoopAnim("corridor", animMarkers.corridorGlow, economicCorridorAnimPath, 20000, function (t) { return t; });
  }

  function applyBridgeMode(mode) {
    routeMode = mode;
    setRouteModeButtons(mode);
    var isAncient = mode === "ancient";
    if (isWarmBridgeKey(activeMapStory) && currentIndex === 1) {
      hideAllWarmBridgeMarkers();
      updateWarmBridgeMarkers(activeMapStory, isAncient);
      showWarmBridgeLines(activeMapStory, isAncient);
    } else if (isBigBridgeKey(activeMapStory) && currentIndex === 0) {
      showBigBridgeLines(activeMapStory, isAncient);
    } else {
      updateWarmBridgeMarkers("dushan", isAncient);
      if (isAncient) {
        layers.routes.addLayer(villagerOldLine);
        if (layers.routes.hasLayer(villagerNewLine)) layers.routes.removeLayer(villagerNewLine);
      } else {
        if (layers.routes.hasLayer(villagerOldLine)) layers.routes.removeLayer(villagerOldLine);
        layers.routes.addLayer(villagerNewLine);
      }
    }
    updateFxVisibility();
    startAllAnimations();
    if (currentIndex === 0 && isBigBridgeKey(activeMapStory)) {
      var story = BIG_BRIDGE_STORIES[activeMapStory];
      startRouteTimer(isAncient ? story.timerAncient : story.timerModern, isAncient ? story.timerAncientLabel : story.timerModernLabel);
    }
  }

  var jumpTargets = {
    bridge: { center: LOC.bridge, zoom: 13, label: "花江峡谷大桥" },
    beipan: { center: LOC.beipan, zoom: 13, label: "北盘江大桥" },
    yachi: { center: LOC.yachi, zoom: 13, label: "鸭池河大桥" },
    baling: { center: LOC.baling, zoom: 13, label: "坝陵河大桥" },
    kelizhai: { center: LOC.kelizhai, zoom: 14, label: "科力寨" },
    xiaohuajiang: { center: LOC.xiaohuajiang, zoom: 14, label: "小花江村" },
    yunfu: { center: LOC.yunfu, zoom: 14, label: "云渡服务区" },
    dushan: { center: LOC.dushan, zoom: 12, label: "独山县·麻万镇", useDushanScale: true },
    leishanSchool: { center: LOC.leishanSchool, zoom: 13, label: "雷山上学桥" },
    congjiangHealth: { center: LOC.congjiangHealth, zoom: 13, label: "从江健康桥" },
    gaoqiao: { center: LOC.gaoqiao, zoom: 15, label: "高桥" },
    tiaodeng: { center: LOC.tiaodeng, zoom: 15, label: "跳等桥" },
    guiyang: { center: LOC.guiyang, zoom: 12, label: "贵阳枢纽" },
    zunyi: { center: LOC.zunyi, zoom: 13, label: "遵义片区" },
    tongren: { center: LOC.tongren, zoom: 13, label: "铜仁片区" },
    bijie: { center: LOC.bijie, zoom: 13, label: "毕节片区" },
    kaili: { center: LOC.kaili, zoom: 13, label: "凯里片区" },
    beipanGuizhou: { center: LOC.beipanGuizhou, zoom: 14, label: "都格镇·贵州侧" },
    beipanYunnan: { center: LOC.beipanYunnan, zoom: 14, label: "都格镇·云南侧" },
    yachiGuiyang: { center: LOC.yachiGuiyang, zoom: 14, label: "贵阳方向" },
    yachiQianxi: { center: LOC.yachiQianxi, zoom: 14, label: "黔西方向" },
    balingHuangguoshu: { center: LOC.balingHuangguoshu, zoom: 14, label: "黄果树景区" },
    balingScenic: { center: LOC.balingScenic, zoom: 14, label: "桥旅体验区" },
    leishanVillageLife: { center: LOC.leishanVillage, zoom: 14, label: "苗寨上学路" },
    leishanGate: { center: LOC.leishanSchoolGate, zoom: 14, label: "雷山小学" },
    leishanOldFord: { center: LOC.leishanOldFord, zoom: 15, label: "旧渡点" },
    congjiangVillageLife: { center: LOC.congjiangVillage, zoom: 14, label: "侗寨人家" },
    congjiangClinicPt: { center: LOC.congjiangClinic, zoom: 14, label: "乡卫生院" },
    congjiangOldFord: { center: LOC.congjiangOldFord, zoom: 15, label: "旧桥渡点" }
  };

  function flyToTarget(key, isStoryJump) {
    var t = jumpTargets[key];
    if (!t) return;
    if (isStoryJump) {
      activeMapStory = key;
      if (currentIndex === 0 || currentIndex === 1) {
        var stepId = STEPS[currentIndex].id;
        var idx = findSubStoryIndex(stepId, key);
        if (idx !== subStoryIndex) {
          subStoryIndex = idx;
          paintSubStoryPanel(SUB_STORIES[stepId][idx], STEPS[currentIndex]);
          updateSubStoryControls(SUB_STORIES[stepId], idx);
        }
        setRegionButtons(regionForStoryKey(key));
      }
    }
    if (t.useDushanScale) {
      flyToDushanAtScale();
      el.mapBadge.innerHTML = "<strong>当前视点</strong> · " + t.label;
      setTimeout(function () {
        if (isStoryJump) playWarmBridgeFx(key);
        else {
          highlightMarker(markers.dushan);
          if (markers.newBridgeOk && layers.points.hasLayer(markers.newBridgeOk)) highlightMarker(markers.newBridgeOk);
        }
      }, 1300);
      return;
    }
    var maxZoomIn = zoomForScaleBarKm(t.center[0], DUSHAN_SCALE_KM);
    var zoom = Math.min(t.zoom, maxZoomIn);
    map.flyTo(t.center, zoom, { duration: 1.2 });
    el.mapBadge.innerHTML = "<strong>当前视点</strong> · " + t.label;
    setTimeout(function () {
      if (isStoryJump && isBigBridgeKey(key) && currentIndex === 0) playBigBridgeFx(key);
      else if (isStoryJump && isWarmBridgeKey(key) && currentIndex === 1) playWarmBridgeFx(key);
      else {
        var mk = markers[key];
        if (!mk && key === "gaoqiao") mk = routeMode === "ancient" ? markers.gaoqiaoDanger : markers.gaoqiaoOk;
        if (!mk && key === "tiaodeng") mk = routeMode === "ancient" ? markers.tiaodengDanger : markers.tiaodengOk;
        if (!mk && key === "leishanOldFord") mk = markers.leishanOldDanger;
        if (!mk && key === "congjiangOldFord") mk = markers.congjiangOldDanger;
        if (mk) highlightMarker(mk);
      }
    }, 1300);
  }

  function bindMapJumps() {
    document.querySelectorAll(".map-jump, .bridge-story-jump").forEach(function (node) {
      node.addEventListener("click", function (e) {
        e.preventDefault();
        flyToTarget(node.getAttribute("data-target"), node.classList.contains("bridge-story-jump"));
      });
    });
  }

  document.getElementById("btnSubStoryPrev").addEventListener("click", function () { goToSubStory(subStoryIndex - 1); });
  document.getElementById("btnSubStoryNext").addEventListener("click", function () { goToSubStory(subStoryIndex + 1); });
  document.getElementById("btnPrev").addEventListener("click", function () { goToStep(currentIndex - 1); });
  document.getElementById("btnNext").addEventListener("click", function () {
    if (currentIndex < STEPS.length - 1) goToStep(currentIndex + 1);
  });
  document.querySelectorAll(".region-btn[data-region]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      goToRegionStory(btn.getAttribute("data-region"));
    });
  });
  document.getElementById("btnMapHome").addEventListener("click", function () { flyToRegion("all", "贵州省域总览"); });
  document.getElementById("btnZoomIn").addEventListener("click", function () { map.zoomIn(); });
  document.getElementById("btnZoomOut").addEventListener("click", function () { map.zoomOut(); });
  document.getElementById("btnReplayAnim").addEventListener("click", function () {
    var subs = getSubStoriesForStep(STEPS[currentIndex]);
    if (currentIndex === 0 && subs) playBigBridgeFx(subs[subStoryIndex].key);
    else if (currentIndex === 1 && subs) playWarmBridgeFx(subs[subStoryIndex].key);
    else startAllAnimations();
  });
  document.getElementById("btnRouteAncient").addEventListener("click", function () { applyBridgeMode("ancient"); });
  document.getElementById("btnRouteModern").addEventListener("click", function () { applyBridgeMode("modern"); });
  document.getElementById("basemapSelect").addEventListener("change", function () {
    applyBasemap(this.value);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowRight" && currentIndex < STEPS.length - 1) { e.preventDefault(); goToStep(currentIndex + 1); }
    if (e.key === "ArrowLeft" && currentIndex > 0) { e.preventDefault(); goToStep(currentIndex - 1); }
  });

  buildStepNav();
  initMap();
  applyBridgeMode("ancient");
  currentIndex = -1;
  goToStep(0);
  setTimeout(function () {
    map.invalidateSize();
    if (overviewMap) overviewMap.invalidateSize();
    resizeFxCanvas();
  }, 300);
  window.addEventListener("resize", function () {
    map.invalidateSize();
    if (overviewMap) overviewMap.invalidateSize();
    resizeFxCanvas();
  });
})();
  </script>
