<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>ArcGIS Maps SDK for JavaScript Tutorials: Display a map</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }
    #pageHeader {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 52px;
      line-height: 52px;
      text-align: center;
      color: #fff;
      font-size: 20px;
      font-weight: 600;
      background: linear-gradient(90deg, #0d6efe, #1d8bff);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      z-index: 130;
    }
    /* 底图选择器样式：固定在左上角，悬浮于地图之上 */
    #basemapSelector {
      position: absolute;
      top: 66px;
      left: 70px;
      z-index: 100;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: white;
      font-size: 14px;
    }
    /* 地图容器必须设置高度，否则无法显示 */
    #viewDiv {
      height: 100%;
      width: 100%;
    }

    /* 自定义 + / - 缩放控件 */
    #zoomControls {
      position: absolute;
      top: 66px;
      left: 20px;
      z-index: 110;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #zoomControls button {
      width: 36px;
      height: 36px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      background: #fff;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
    }
    #zoomControls button:active {
      transform: translateY(1px);
    }
    #bottomInfoBar {
      position: absolute;
      left: 16px;
      bottom: 14px;
      z-index: 120;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    #scaleBarDiv {
      pointer-events: auto;
    }
    #mouseCoord {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      color: #1f2d3d;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
      white-space: nowrap;
      line-height: 1.2;
    }
    /* 测量面板：固定在左侧中间，避免和其他控件重叠 */
    #measureContainer {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 121;
      width: 280px;
      max-height: 55vh;
      overflow: auto;
      pointer-events: auto;
    }
  </style>
  <!-- Load the ArcGIS Maps SDK for JavaScript from CDN -->
  <script src="https://js.arcgis.com/4.30/"></script>
  <script>
    require([
      "esri/Map",
      "esri/views/MapView",
      "esri/layers/FeatureLayer",
      "esri/widgets/ScaleBar",
      "esri/widgets/Legend",
      "esri/widgets/Search",
      "esri/widgets/LayerList",
      "esri/widgets/Expand",
      "esri/widgets/Editor",
      "esri/widgets/Measurement",
      "esri/widgets/Sketch",
      "esri/layers/GraphicsLayer",
      "esri/Graphic",
      "esri/geometry/geometryEngine",
      "esri/geometry/Polyline"
    ], function(Map, MapView, FeatureLayer, ScaleBar, Legend, Search, LayerList, Expand, Editor, Measurement, Sketch, GraphicsLayer, Graphic, geometryEngine, Polyline) {
      // 1.初始化地图
      var map1 = new Map({
        basemap: "streets",
      });

      // 2.初始化地图视图
      var view = new MapView({
        container: "viewDiv",
        map: map1,
        zoom: 8.0,
        center: [118.215428, 25.295194], // longitude, latitude
        padding: {
          top: 56
        }
      });

      // 3. 添加 GeoScene Online 的点/线/面三个子图层
      var quanzhouPointLayer = new FeatureLayer({
        url: "https://www.geosceneonline.cn/server/rest/services/Hosted/quanzhou/FeatureServer/0",
        title: "quanzhou_scene_point"
      });
      var quanzhouRoadLayer = new FeatureLayer({
        url: "https://www.geosceneonline.cn/server/rest/services/Hosted/quanzhou/FeatureServer/1",
        title: "quanzhou_road2"
      });
      var quanzhouCountyLayer = new FeatureLayer({
        url: "https://www.geosceneonline.cn/server/rest/services/Hosted/quanzhou/FeatureServer/2",
        title: "quanzhou_county"
      });
      map1.addMany([quanzhouCountyLayer, quanzhouRoadLayer, quanzhouPointLayer]);

      // 3.1 添加图例（左下，位于比例尺上方）
      var legend = new Legend({ view: view });
      view.ui.add(legend, { position: "bottom-right", index: 0 });

      // 3.2 添加比例尺（左下，单位公里/米，自动采用美观取整刻度）
      var scaleBar = new ScaleBar({
        view: view,
        unit: "metric",
        container: "scaleBarDiv"
      });

      // 3.3 添加图层列表微按钮（右上）
      var layerList = new LayerList({ view: view });
      var layerListExpand = new Expand({
        view: view,
        content: layerList,
        expandTooltip: "图层列表",
        collapseTooltip: "收起图层列表",
        mode: "floating"
      });
      view.ui.add(layerListExpand, { position: "top-right", index: 1 });

      // 3.4 添加编辑功能（新增/修改点线面，并填写属性字段）
      var editor = new Editor({
        view: view,
        layerInfos: [
          { layer: quanzhouPointLayer, enabled: true },
          { layer: quanzhouRoadLayer, enabled: true },
          { layer: quanzhouCountyLayer, enabled: true }
        ],
        visibleElements: {
          settingsMenu: true,
          snappingControls: true
        }
      });
      var editorExpand = new Expand({
        view: view,
        content: editor,
        expandTooltip: "编辑图层",
        collapseTooltip: "收起编辑器",
        mode: "floating"
      });
      view.ui.add(editorExpand, { position: "top-right", index: 2 });

      // 3.5 添加测量工具（统一测量组件，稳定支持画线/画面）
      var measurement = new Measurement({
        view: view,
        container: "measureContainer",
        visible: false
      });

      function clearMeasureWidgets() {
        measurement.clear();
        measurement.activeTool = null;
        measurement.visible = false;
      }
      function activateMeasurementTool(toolName) {
        measurement.visible = true;
        measurement.clear();
        measurement.activeTool = toolName; // "distance" | "area"
      }
      var panelBtnStyle = "width:100%;margin-bottom:6px;box-sizing:border-box;padding:7px 8px;line-height:1.3;font-size:14px;white-space:normal;word-break:break-word;";

      var measurePanel = document.createElement("div");
      measurePanel.style.padding = "8px";
      measurePanel.style.width = "220px";
      measurePanel.innerHTML = [
        '<button id="btnMeasureDistance" style="' + panelBtnStyle + '">📏 距离测量（画线）</button>',
        '<button id="btnMeasureArea" style="' + panelBtnStyle + '">📐 面积测量</button>',
        '<button id="btnMeasureClear" style="' + panelBtnStyle + '">🧹 清除测量</button>',
        '<button id="btnMeasureCancel" style="' + panelBtnStyle.replace("margin-bottom:6px;", "") + '">❌ 取消并退出</button>'
      ].join("");
      var measureExpand = new Expand({
        view: view,
        content: measurePanel,
        expandTooltip: "测量工具",
        collapseTooltip: "收起测量工具",
        expandIconClass: "esri-icon-measure-line",
        mode: "floating"
      });
      view.ui.add(measureExpand, { position: "top-right", index: 3 });
      measurePanel.querySelector("#btnMeasureDistance").onclick = function() {
        activateMeasurementTool("distance");
      };
      measurePanel.querySelector("#btnMeasureArea").onclick = function() {
        activateMeasurementTool("area");
      };
      measurePanel.querySelector("#btnMeasureClear").onclick = function() {
        clearMeasureWidgets();
      };
      measurePanel.querySelector("#btnMeasureCancel").onclick = function() {
        clearMeasureWidgets();
        measureExpand.expanded = false;
      };

      // 3.6 添加地理处理（缓冲区分析）
      var gpDrawLayer = new GraphicsLayer({ title: "分析绘制图层" });
      var gpResultLayer = new GraphicsLayer({ title: "分析结果图层" });
      map1.addMany([gpDrawLayer, gpResultLayer]);

      var sketch = new Sketch({
        layer: gpDrawLayer,
        view: view,
        creationMode: "single"
      });
      view.ui.add(sketch, "top-right");
      sketch.visible = false;

      var currentBufferDistance = 1000;
      var currentBufferUnit = "meters";

      function runBufferAnalysis(geom) {
        gpResultLayer.removeAll();
        if (!geom) return;
        var bufferGeom = geometryEngine.geodesicBuffer(geom, currentBufferDistance, currentBufferUnit);
        if (!bufferGeom) return;
        var bufferGraphic = new Graphic({
          geometry: bufferGeom,
          symbol: {
            type: "simple-fill",
            color: [0, 120, 255, 0.15],
            outline: { color: [0, 120, 255, 0.9], width: 2 }
          }
        });
        gpResultLayer.add(bufferGraphic);

        quanzhouPointLayer.queryFeatureCount({
          geometry: bufferGeom,
          spatialRelationship: "intersects",
          where: "1=1"
        }).then(function(count) {
          view.popup.open({
            title: "缓冲区分析结果",
            content: "范围内景点数量: " + count,
            location: bufferGeom.extent.center
          });
        }).catch(console.error);
      }

      sketch.on("create", function(evt) {
        if (evt.state === "complete") {
          runBufferAnalysis(evt.graphic.geometry);
          sketch.visible = false;
        }
      });

      var gpPanel = document.createElement("div");
      gpPanel.style.padding = "8px";
      gpPanel.style.width = "240px";
      gpPanel.innerHTML = [
        '<div style="margin-bottom:6px;">缓冲距离：</div>',
        '<input id="bufferDistanceInput" type="number" value="1000" min="1" style="width:100%;margin-bottom:6px;" />',
        '<select id="bufferUnitSelect" style="width:100%;margin-bottom:6px;">',
        '<option value="meters">米</option>',
        '<option value="kilometers">千米</option>',
        '</select>',
        '<button id="btnDrawPoint" style="' + panelBtnStyle + '">📍 绘制点并分析</button>',
        '<button id="btnDrawLine" style="' + panelBtnStyle + '">🛣️ 绘制线并分析</button>',
        '<button id="btnDrawPolygon" style="' + panelBtnStyle + '">🔷 绘制面并分析</button>',
        '<button id="btnBufferClear" style="' + panelBtnStyle.replace("margin-bottom:6px;", "") + '">🧹 清空分析结果</button>'
      ].join("");
      var gpExpand = new Expand({
        view: view,
        content: gpPanel,
        expandTooltip: "地理处理",
        collapseTooltip: "收起地理处理",
        expandIconClass: "esri-icon-polygon",
        mode: "floating"
      });
      view.ui.add(gpExpand, { position: "top-right", index: 4 });
      gpPanel.querySelector("#btnDrawPoint").onclick = function() {
        currentBufferDistance = Number(gpPanel.querySelector("#bufferDistanceInput").value || 1000);
        currentBufferUnit = gpPanel.querySelector("#bufferUnitSelect").value;
        sketch.visible = true;
        sketch.create("point");
      };
      gpPanel.querySelector("#btnDrawLine").onclick = function() {
        currentBufferDistance = Number(gpPanel.querySelector("#bufferDistanceInput").value || 1000);
        currentBufferUnit = gpPanel.querySelector("#bufferUnitSelect").value;
        sketch.visible = true;
        sketch.create("polyline");
      };
      gpPanel.querySelector("#btnDrawPolygon").onclick = function() {
        currentBufferDistance = Number(gpPanel.querySelector("#bufferDistanceInput").value || 1000);
        currentBufferUnit = gpPanel.querySelector("#bufferUnitSelect").value;
        sketch.visible = true;
        sketch.create("polygon");
      };
      gpPanel.querySelector("#btnBufferClear").onclick = function() {
        gpDrawLayer.removeAll();
        gpResultLayer.removeAll();
        sketch.cancel();
        sketch.visible = false;
      };

      // 3.7 添加路径分析（起点 + 景点终点 + 道路最短路径）
      var routeLayer = new GraphicsLayer({ title: "路径分析结果" });
      map1.add(routeLayer);
      var routeNodeMap = new window.Map();
      var graphBuilt = false;
      var routePickState = 0; // 0=空闲 1=等起点 2=等终点
      var routeStartPoint = null;

      function routeKey(x, y) {
        return x.toFixed(3) + "," + y.toFixed(3);
      }
      function ensureRouteNode(x, y) {
        var key = routeKey(x, y);
        if (!routeNodeMap.has(key)) {
          routeNodeMap.set(key, { x: x, y: y, neighbors: [] });
        }
        return key;
      }
      function xyDistance(ax, ay, bx, by) {
        var dx = ax - bx;
        var dy = ay - by;
        return Math.sqrt(dx * dx + dy * dy);
      }
      function addRouteEdge(aKey, bKey, cost) {
        routeNodeMap.get(aKey).neighbors.push({ to: bKey, cost: cost });
        routeNodeMap.get(bKey).neighbors.push({ to: aKey, cost: cost });
      }
      function nearestRouteNodeKey(pt) {
        var bestKey = null;
        var bestDist = Infinity;
        routeNodeMap.forEach(function(node, key) {
          var d = xyDistance(pt.x, pt.y, node.x, node.y);
          if (d < bestDist) {
            bestDist = d;
            bestKey = key;
          }
        });
        return bestKey;
      }
      function dijkstraRoute(startKey, endKey) {
        var dist = new window.Map();
        var prev = new window.Map();
        var visited = new Set();

        routeNodeMap.forEach(function(_, key) {
          dist.set(key, Infinity);
        });
        dist.set(startKey, 0);

        while (true) {
          var u = null;
          var best = Infinity;
          dist.forEach(function(d, key) {
            if (!visited.has(key) && d < best) {
              best = d;
              u = key;
            }
          });
          if (!u || u === endKey) break;
          visited.add(u);

          var neighbors = routeNodeMap.get(u).neighbors;
          for (var i = 0; i < neighbors.length; i++) {
            var nb = neighbors[i];
            var alt = dist.get(u) + nb.cost;
            if (alt < dist.get(nb.to)) {
              dist.set(nb.to, alt);
              prev.set(nb.to, u);
            }
          }
        }

        var path = [];
        var cur = endKey;
        if (!prev.has(cur) && cur !== startKey) return null;
        while (cur) {
          path.push(cur);
          if (cur === startKey) break;
          cur = prev.get(cur);
        }
        path.reverse();
        return path;
      }
      function buildRoadGraph() {
        if (graphBuilt) return Promise.resolve();
        return quanzhouRoadLayer.queryFeatures({
          where: "1=1",
          returnGeometry: true,
          outFields: []
        }).then(function(fs) {
          routeNodeMap.clear();
          fs.features.forEach(function(feature) {
            var paths = (feature.geometry && feature.geometry.paths) || [];
            paths.forEach(function(path) {
              for (var i = 0; i < path.length - 1; i++) {
                var a = path[i];
                var b = path[i + 1];
                var aKey = ensureRouteNode(a[0], a[1]);
                var bKey = ensureRouteNode(b[0], b[1]);
                addRouteEdge(aKey, bKey, xyDistance(a[0], a[1], b[0], b[1]));
              }
            });
          });
          graphBuilt = true;
        });
      }

      var routePanel = document.createElement("div");
      routePanel.style.padding = "8px";
      routePanel.style.width = "260px";
      routePanel.innerHTML = [
        '<button id="btnStartRoute" style="' + panelBtnStyle + '">🧭 开始路径分析（先点起点，再点景点）</button>',
        '<button id="btnClearRoute" style="' + panelBtnStyle.replace("margin-bottom:6px;", "") + '">🧹 清除路径结果</button>'
      ].join("");
      var routeExpand = new Expand({
        view: view,
        content: routePanel,
        expandTooltip: "路径分析",
        collapseTooltip: "收起路径分析",
        expandIconClass: "esri-icon-route",
        mode: "floating"
      });
      view.ui.add(routeExpand, { position: "top-right", index: 5 });
      routePanel.querySelector("#btnStartRoute").onclick = function() {
        buildRoadGraph().then(function() {
          routePickState = 1;
          routeStartPoint = null;
          view.popup.open({
            title: "路径分析",
            content: "请先在地图上点击起点，再点击一个景点点要素作为终点。",
            location: view.center
          });
        });
      };
      routePanel.querySelector("#btnClearRoute").onclick = function() {
        routeLayer.removeAll();
        routePickState = 0;
        routeStartPoint = null;
      };

      view.on("click", function(event) {
        if (routePickState === 0) return;
        if (routePickState === 1) {
          routeStartPoint = event.mapPoint;
          routePickState = 2;
          routeLayer.removeAll();
          routeLayer.add(new Graphic({
            geometry: routeStartPoint,
            symbol: {
              type: "simple-marker",
              color: [0, 200, 0, 1],
              size: 10,
              outline: { color: [255, 255, 255, 1], width: 1 }
            },
            popupTemplate: { title: "起点", content: "路径分析起点" }
          }));
          return;
        }
        if (routePickState === 2) {
          view.hitTest(event).then(function(hit) {
            var scenicHit = (hit.results || []).find(function(r) {
              return r.graphic && r.graphic.layer === quanzhouPointLayer;
            });
            if (!scenicHit) {
              view.popup.open({
                title: "提示",
                content: "请点击景点点要素作为终点。",
                location: event.mapPoint
              });
              return;
            }
            var endPoint = scenicHit.graphic.geometry;
            var startKey = nearestRouteNodeKey(routeStartPoint);
            var endKey = nearestRouteNodeKey(endPoint);
            if (!startKey || !endKey) {
              view.popup.open({
                title: "路径分析",
                content: "道路网络节点不足，无法分析。",
                location: event.mapPoint
              });
              return;
            }
            var routeKeys = dijkstraRoute(startKey, endKey);
            if (!routeKeys || routeKeys.length < 2) {
              view.popup.open({
                title: "路径分析",
                content: "未找到可达路径，请检查道路连通性。",
                location: event.mapPoint
              });
              return;
            }
            var coords = routeKeys.map(function(k) {
              var node = routeNodeMap.get(k);
              return [node.x, node.y];
            });
            var routeGeom = new Polyline({
              paths: [coords],
              spatialReference: quanzhouRoadLayer.spatialReference
            });
            routeLayer.addMany([
              new Graphic({
                geometry: routeGeom,
                symbol: { type: "simple-line", color: [255, 0, 0, 0.95], width: 4 },
                popupTemplate: { title: "最短路径", content: "基于现有道路图层的最短路径结果" }
              }),
              new Graphic({
                geometry: endPoint,
                symbol: {
                  type: "simple-marker",
                  color: [255, 0, 0, 1],
                  size: 10,
                  outline: { color: [255, 255, 255, 1], width: 1 }
                },
                popupTemplate: { title: "终点", content: "景点终点" }
              })
            ]);
            view.goTo(routeGeom.extent.expand(1.4));
            routePickState = 0;
          });
        }
      });

      // 3.8 添加搜索框（按图层可用字段自动配置）
      Promise.all([
        quanzhouPointLayer.load(),
        quanzhouRoadLayer.load(),
        quanzhouCountyLayer.load()
      ]).then(function() {
        function applyPopupTemplate(layer) {
          var fieldInfos = (layer.fields || []).map(function(field) {
            return {
              fieldName: field.name,
              label: field.alias || field.name,
              visible: true
            };
          });
          layer.popupTemplate = {
            title: layer.title + " 属性信息",
            content: [
              {
                type: "fields",
                fieldInfos: fieldInfos
              }
            ]
          };
          layer.outFields = ["*"];
        }

        applyPopupTemplate(quanzhouPointLayer);
        applyPopupTemplate(quanzhouRoadLayer);
        applyPopupTemplate(quanzhouCountyLayer);

        function pickSearchField(layer) {
          var preferred = ["name", "Name", "NAME", "city", "City", "CITY", "county", "County", "COUNTY"];
          var names = (layer.fields || []).map(function(f) { return f.name; });
          for (var i = 0; i < preferred.length; i++) {
            if (names.indexOf(preferred[i]) > -1) return preferred[i];
          }
          return layer.displayField || names[0];
        }

        function makeSource(layer, placeholder) {
          var field = pickSearchField(layer);
          if (!field) return null;
          return {
            layer: layer,
            searchFields: [field],
            displayField: field,
            outFields: ["*"],
            name: layer.title,
            placeholder: placeholder,
            exactMatch: false,
            maxResults: 2000,
            maxSuggestions: 50,
            suggestionsEnabled: true,
            minSuggestCharacters: 1
          };
        }

        var sources = [
          makeSource(quanzhouPointLayer, "搜索景点/点位"),
          makeSource(quanzhouRoadLayer, "搜索道路"),
          makeSource(quanzhouCountyLayer, "搜索区县")
        ].filter(function(s) { return !!s; });

        var searchWidget = new Search({
          view: view,
          includeDefaultSources: false,
          locationEnabled: false,
          popupEnabled: true,
          resultGraphicEnabled: true,
          popupOpenOnSelect: true,
          autoSelect: false,
          sources: sources
        });
        view.ui.add(searchWidget, { position: "top-right", index: 0 });
      }).catch(function() {
        // 即使图层字段读取失败，也保留可用搜索框
        var fallbackSearch = new Search({
          view: view,
          includeDefaultSources: true,
          locationEnabled: false
        });
        view.ui.add(fallbackSearch, { position: "top-right", index: 0 });
      });

      // 3.9 鼠标经纬度监听：在比例尺右侧实时显示坐标
      var coordEl = document.getElementById("mouseCoord");
      var viewDiv = document.getElementById("viewDiv");
      document.addEventListener("mousemove", function(event) {
        var rect = viewDiv.getBoundingClientRect();
        var sx = Math.min(Math.max(event.clientX, rect.left), rect.right);
        var sy = Math.min(Math.max(event.clientY, rect.top), rect.bottom);
        var mapPoint = view.toMap({ x: sx - rect.left, y: sy - rect.top });
        if (!mapPoint) return;
        var lon = mapPoint.longitude;
        var lat = mapPoint.latitude;
        if (typeof lon === "number" && typeof lat === "number") {
          coordEl.textContent = "经度: " + lon.toFixed(6) + "  纬度: " + lat.toFixed(6);
        }
      });

      // 4.自定义 + / - 控件：点击调整 zoom
      document.getElementById("zoomInBtn").addEventListener("click", function() {
        view.zoom = view.zoom + 1;
      });
      document.getElementById("zoomOutBtn").addEventListener("click", function() {
        view.zoom = view.zoom - 1;
      });

      // 5. 底图切换逻辑：监听下拉框变化，更新地图底图
      const basemapSelect = document.getElementById("basemapSelector");
      basemapSelect.addEventListener("change", function(e) {
        // 切换底图（ArcGIS内置底图名称）
        map1.basemap = e.target.value;
      });
    });
  </script>  
</head>
