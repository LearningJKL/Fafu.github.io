<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>贵州省 2023 年道路 · 路径规划</title>
  <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      overflow: hidden;
    }

    #pageHeader {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      line-height: 48px;
      text-align: center;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(90deg, #1565c0, #1e88e5);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      z-index: 200;
    }

    #viewDiv { height: 100%; width: 100%; }

    #mapToolbar {
      position: absolute;
      top: 60px;
      left: 14px;
      z-index: 120;
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 10px;
      max-height: calc(100vh - 72px);
      overflow-y: auto;
      overflow-x: hidden;
      pointer-events: auto;
    }

    .toolbar-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    #toolbarLeft {
      width: 280px;
    }

    #toolbarRight {
      width: 260px;
    }

    .tool-card {
      background: #fff;
      border-radius: 6px;
      border: 1px solid #d0d0d0;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.12);
      padding: 10px 12px;
    }

    .tool-card h3 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }

    #basemapSelector {
      width: 100%;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .tool-card label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #444;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .tool-card label:last-child { margin-bottom: 0; }

    .tool-hint {
      margin: 8px 0 0;
      font-size: 11px;
      color: #888;
      line-height: 1.5;
    }

    .tool-btn {
      width: 100%;
      margin-top: 6px;
      padding: 7px 10px;
      font-size: 13px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: #1976d2;
      color: #fff;
    }

    .tool-btn.secondary {
      background: #fff;
      color: #333;
      border: 1px solid #ccc;
    }

    .tool-btn.secondary:hover { background: #f5f5f5; }

    #snapRadius {
      width: 100%;
      margin-top: 4px;
    }

    #snapRadiusLabel {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
    }

    .coord-group {
      margin-bottom: 10px;
    }

    .coord-group-title {
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
    }

    .coord-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
    }

    .coord-row label {
      width: 32px;
      flex-shrink: 0;
      font-size: 12px;
      color: #666;
      margin: 0;
      cursor: default;
    }

    .coord-row input {
      flex: 1;
      min-width: 0;
      padding: 5px 6px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    #routeStatus {
      margin-top: 8px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.55;
      color: #444;
      background: #f5f9ff;
      border-radius: 4px;
      border-left: 3px solid #1976d2;
    }

    #bottomBar {
      position: absolute;
      left: 14px;
      bottom: 12px;
      z-index: 120;
      pointer-events: none;
    }

    #mouseCoord {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      color: #333;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      white-space: nowrap;
    }

    #routePanel h2 {
      margin: 0 0 10px;
      font-size: 15px;
      color: #1565c0;
    }

    #routePanelContent {
      display: none;
    }

    #routePanel.visible #routePanelContent {
      display: block;
    }

    #routePanel:not(.visible)::after {
      content: "完成路径规划后在此显示结果";
      display: block;
      font-size: 12px;
      color: #999;
      line-height: 1.6;
    }

    .route-stat {
      font-size: 13px;
      line-height: 1.7;
      color: #444;
      margin-bottom: 4px;
    }

    .route-stat strong { color: #222; }

    .esri-view .esri-view-surface--inset-outline:focus::after { outline: none; }
  </style>
  <script src="https://js.arcgis.com/4.30/"></script>
</head>
<body>
  <header id="pageHeader">贵州省 2023 年道路数据 · 路径规划</header>
  <div id="viewDiv"></div>

  <div id="mapToolbar">
    <div class="toolbar-column" id="toolbarLeft">
      <div class="tool-card">
        <h3>底图</h3>
        <select id="basemapSelector" aria-label="选择底图">
        <option value="streets">街道图（Streets）</option>
        <option value="topo">地形图（Topographic）</option>
        <option value="satellite" selected>卫星图（Satellite）</option>
        <option value="hybrid">混合图（Hybrid）</option>
        <option value="oceans">海洋图（Oceans）</option>
        <option value="gray">灰色底图（Gray）</option>
        <option value="dark-gray">深灰底图（Dark Gray）</option>
      </select>
    </div>
    <div class="tool-card">
      <h3>数据图层（GeoScene Online）</h3>
      <label><input type="checkbox" id="layerBoundary" checked /> 贵州省市界（面）</label>
      <label><input type="checkbox" id="layerRoad" checked /> 2023 年道路（线）</label>
      </div>
      <div class="tool-card">
        <h3>道路吸附</h3>
        <p class="tool-hint">点击地图时，在下方半径内搜索最近道路线，起终点将自动吸附到道路。</p>
      <input type="range" id="snapRadius" min="200" max="3000" step="100" value="1000" />
      <div id="snapRadiusLabel">搜索半径：1000 米</div>
    </div>
    <div class="tool-card">
      <h3>坐标输入规划</h3>
      <p class="tool-hint">支持<strong>小数度</strong>（如 106.71362）或<strong>度分秒</strong>（如 106°42′49″、106 42 49）。可加 E/W、N/S 方向。</p>
      <div class="coord-group">
        <div class="coord-group-title">起点（A）</div>
        <div class="coord-row">
          <label for="startLon">经度</label>
          <input id="startLon" type="text" placeholder="106.71362 或 106°42′49″E" />
        </div>
        <div class="coord-row">
          <label for="startLat">纬度</label>
          <input id="startLat" type="text" placeholder="26.57833 或 26°34′42″N" />
        </div>
      </div>
      <div class="coord-group">
        <div class="coord-group-title">终点（B）</div>
        <div class="coord-row">
          <label for="endLon">经度</label>
          <input id="endLon" type="text" placeholder="107.52306 或 107°31′23″E" />
        </div>
        <div class="coord-row">
          <label for="endLat">纬度</label>
          <input id="endLat" type="text" placeholder="26.25472 或 26°15′17″N" />
        </div>
      </div>
      <button type="button" class="tool-btn" id="btnPlanByCoord">按坐标规划路径</button>
    </div>
    </div>
    <div class="toolbar-column" id="toolbarRight">
      <div class="tool-card">
      <h3>路径规划</h3>
      <p class="tool-hint">在地图上依次点击选择<strong>起点</strong>和<strong>终点</strong>，系统将沿 2023 年道路线网计算最短路径。道路按双向通行处理，正反方向均可规划。</p>
      <div id="routeStatus">请点击地图选择起点（A）</div>
      <button type="button" class="tool-btn secondary" id="btnClearRoute">清除路线</button>
    </div>
      <aside id="routePanel" class="tool-card">
        <h2>规划结果</h2>
        <div id="routePanelContent"></div>
      </aside>
    </div>
  </div>

  <div id="bottomBar">
    <div id="mouseCoord">经度 — °　纬度 — °</div>
  </div>

  <script>
    require([
      "esri/Map",
      "esri/views/MapView",
      "esri/layers/FeatureLayer",
      "esri/layers/GraphicsLayer",
      "esri/Graphic",
      "esri/geometry/Polyline",
      "esri/geometry/Point",
      "esri/widgets/ScaleBar",
      "esri/widgets/Compass",
      "esri/rest/support/Query",
      "esri/geometry/geometryEngine",
      "esri/geometry/support/webMercatorUtils"
    ], function (
      Map, MapView, FeatureLayer, GraphicsLayer, Graphic, Polyline, Point,
      ScaleBar, Compass, Query, geometryEngine, webMercatorUtils
    ) {
      var SERVICE = {
        road: "https://www.geosceneonline.cn/server/rest/services/Hosted/贵州省2023年道路数据/FeatureServer/0",
        boundary: "https://www.geosceneonline.cn/server/rest/services/Hosted/贵州省桥梁市界/FeatureServer/1"
      };

      var CONNECT_TOLERANCE_M = 25;
      var MIN_SEARCH_BUFFER_M = 2000;
      var QUERY_PAGE_SIZE = 2000;
      var GRAPH_CHUNK_SIZE = 120;
      var snapSearchRadiusM = 1000;
      var START_NODE_ID = 0;
      var END_NODE_ID = 1;

      var boundaryLayer = new FeatureLayer({
        url: SERVICE.boundary,
        title: "贵州省市界（面）",
        outFields: ["*"],
        popupEnabled: false,
        opacity: 0.3
      });

      var roadLayer = new FeatureLayer({
        url: SERVICE.road,
        title: "2023年贵州省道路数据",
        outFields: ["*"],
        popupEnabled: false,
        renderer: {
          type: "simple",
          symbol: {
            type: "simple-line",
            color: [220, 53, 69, 0.85],
            width: 1.2
          }
        }
      });

      var stopLayer = new GraphicsLayer({ title: "起终点" });
      var routeLayer = new GraphicsLayer({ title: "规划路线" });
      var snapBufferLayer = new GraphicsLayer({ title: "吸附搜索范围" });

      var map = new Map({
        basemap: "satellite",
        layers: [boundaryLayer, roadLayer, routeLayer, snapBufferLayer, stopLayer]
      });

      var view = new MapView({
        container: "viewDiv",
        map: map,
        center: [106.55, 26.65],
        zoom: 7,
        padding: { top: 52 }
      });

      view.ui.add(new ScaleBar({ view: view, unit: "metric" }), "bottom-left");
      view.ui.add(new Compass({ view: view }), "top-right");

      var routeStatusEl = document.getElementById("routeStatus");
      var routePanel = document.getElementById("routePanel");
      var routePanelContent = document.getElementById("routePanelContent");

      var startPoint = null;
      var endPoint = null;
      var startSnapInfo = null;
      var endSnapInfo = null;
      var isRouting = false;
      var isSnapping = false;

      var startSymbol = {
        type: "simple-marker",
        style: "circle",
        color: [46, 125, 50, 0.95],
        size: 14,
        outline: { color: [255, 255, 255], width: 2 }
      };

      var endSymbol = {
        type: "simple-marker",
        style: "circle",
        color: [211, 47, 47, 0.95],
        size: 14,
        outline: { color: [255, 255, 255], width: 2 }
      };

      var routeSymbol = {
        type: "simple-line",
        color: [0, 120, 215, 0.95],
        width: 5,
        cap: "round",
        join: "round"
      };

      function setRouteStatus(text) {
        routeStatusEl.innerHTML = text;
      }

      function yieldToUI() {
        return new Promise(function (resolve) {
          setTimeout(resolve, 0);
        });
      }

      function roadLabel(attrs) {
        if (!attrs) return "未命名道路";
        return attrs.name || attrs.ref || attrs.fclass_cn || "未命名道路";
      }

      function normalizeCoordText(text) {
        return String(text || "")
          .trim()
          .replace(/[度]/g, "°")
          .replace(/[分′']/g, "'")
          .replace(/[秒″"]/g, '"')
          .replace(/,/g, " ")
          .replace(/\s+/g, " ");
      }

      function applyDirection(value, dir, isLat) {
        if (!dir) return value;
        var d = dir.toUpperCase();
        if (d === "W" || d === "S") return -Math.abs(value);
        if (d === "E" || d === "N") return Math.abs(value);
        return value;
      }

      function parseCoordComponent(text, isLat) {
        var raw = normalizeCoordText(text);
        if (!raw) return null;

        var dirMatch = raw.match(/([EWNS])$/i);
        var dir = dirMatch ? dirMatch[1] : null;
        if (dir) raw = raw.replace(/[EWNS]$/i, "").trim();

        var dec = raw.match(/^(-?\d+(?:\.\d+)?)\s*°?$/);
        if (dec) {
          return applyDirection(parseFloat(dec[1]), dir, isLat);
        }

        var nums = raw.match(/\d+(?:\.\d+)?/g);
        if (!nums || !nums.length) return null;

        var sign = 1;
        if (/^-/.test(raw) || dir === "W" || dir === "S") sign = -1;

        var value;
        if (nums.length === 1) {
          value = parseFloat(nums[0]);
        } else if (nums.length === 2) {
          value = parseFloat(nums[0]) + parseFloat(nums[1]) / 60;
        } else {
          value = parseFloat(nums[0]) +
            parseFloat(nums[1]) / 60 +
            parseFloat(nums[2]) / 3600;
        }

        if (sign < 0) value = -Math.abs(value);
        else if (dir === "E" || dir === "N") value = Math.abs(value);

        return value;
      }

      function validateLonLat(lon, lat) {
        if (lon == null || lat == null || !isFinite(lon) || !isFinite(lat)) {
          return "坐标格式无法识别，请使用小数度或度分秒格式。";
        }
        if (lon < -180 || lon > 180 || lat < -90 || lat > 90) {
          return "经纬度超出有效范围（经度 ±180°，纬度 ±90°）。";
        }
        if (lon < 103 || lon > 110 || lat < 24 || lat > 30) {
          return "坐标不在贵州省常见范围内，仍将尝试规划。";
        }
        return null;
      }

      function lonLatToViewPoint(lon, lat) {
        var geoPt = new Point({ longitude: lon, latitude: lat });
        if (view.spatialReference && view.spatialReference.isWebMercator) {
          return webMercatorUtils.geographicToWebMercator(geoPt);
        }
        return geoPt;
      }

      function planRouteFromCoordinateInputs() {
        if (isRouting || isSnapping) {
          setRouteStatus("正在处理中，请稍候…");
          return;
        }

        var startLon = parseCoordComponent(document.getElementById("startLon").value, false);
        var startLat = parseCoordComponent(document.getElementById("startLat").value, true);
        var endLon = parseCoordComponent(document.getElementById("endLon").value, false);
        var endLat = parseCoordComponent(document.getElementById("endLat").value, true);

        if (startLon == null || startLat == null) {
          setRouteStatus("起点经纬度格式有误，请检查输入。");
          return;
        }
        if (endLon == null || endLat == null) {
          setRouteStatus("终点经纬度格式有误，请检查输入。");
          return;
        }

        var warnStart = validateLonLat(startLon, startLat);
        var warnEnd = validateLonLat(endLon, endLat);
        if (warnStart && warnStart.indexOf("无法识别") >= 0) {
          setRouteStatus(warnStart);
          return;
        }
        if (warnEnd && warnEnd.indexOf("无法识别") >= 0) {
          setRouteStatus(warnEnd);
          return;
        }

        var startMapPt = lonLatToViewPoint(startLon, startLat);
        var endMapPt = lonLatToViewPoint(endLon, endLat);

        routeLayer.removeAll();
        routePanel.classList.remove("visible");
        startPoint = null;
        endPoint = null;
        startSnapInfo = null;
        endSnapInfo = null;

        var warnMsg = "";
        if (warnStart && warnStart.indexOf("常见范围") >= 0) warnMsg = warnStart;
        if (warnEnd && warnEnd.indexOf("常见范围") >= 0) warnMsg = warnEnd;

        setRouteStatus(
          (warnMsg ? warnMsg + " " : "") +
          "正在按坐标设置起终点并搜索道路…"
        );

        view.goTo({
          target: [startMapPt, endMapPt],
          zoom: 12
        });

        applySnappedPoint(startMapPt, true).then(function (okStart) {
          if (!okStart) return;
          return applySnappedPoint(endMapPt, false);
        });
      }

      function fastDist(ax, ay, bx, by) {
        return Math.hypot(bx - ax, by - ay);
      }

      function nearestOnSegment(px, py, ax, ay, bx, by) {
        var dx = bx - ax;
        var dy = by - ay;
        var len2 = dx * dx + dy * dy;
        if (len2 === 0) {
          return { x: ax, y: ay, dist: fastDist(px, py, ax, ay) };
        }
        var t = ((px - ax) * dx + (py - ay) * dy) / len2;
        t = t < 0 ? 0 : (t > 1 ? 1 : t);
        var nx = ax + t * dx;
        var ny = ay + t * dy;
        return { x: nx, y: ny, dist: fastDist(px, py, nx, ny) };
      }

      function NodeIndex(toleranceM) {
        this.tolerance = toleranceM;
        this.tol2 = toleranceM * toleranceM;
        this.cellSize = toleranceM;
        this.nodes = [null, null];
        this.grid = {};
        this.nextId = 2;
      }

      NodeIndex.prototype._cellKey = function (cx, cy) {
        return cx + "_" + cy;
      };

      NodeIndex.prototype.getId = function (x, y) {
        var tol2 = this.tol2;
        var cs = this.cellSize;
        var cx = Math.floor(x / cs);
        var cy = Math.floor(y / cs);

        for (var dx = -1; dx <= 1; dx++) {
          for (var dy = -1; dy <= 1; dy++) {
            var bucket = this.grid[this._cellKey(cx + dx, cy + dy)];
            if (!bucket) continue;
            for (var i = 0; i < bucket.length; i++) {
              var n = this.nodes[bucket[i]];
              var ddx = x - n.x;
              var ddy = y - n.y;
              if (ddx * ddx + ddy * ddy <= tol2) {
                return n.id;
              }
            }
          }
        }

        var id = this.nextId++;
        this.nodes[id] = { id: id, x: x, y: y };
        var key = this._cellKey(cx, cy);
        if (!this.grid[key]) this.grid[key] = [];
        this.grid[key].push(id);
        return id;
      };

      function MinHeap() {
        this.heap = [];
      }

      MinHeap.prototype.push = function (item) {
        this.heap.push(item);
        this._bubbleUp(this.heap.length - 1);
      };

      MinHeap.prototype.pop = function () {
        var top = this.heap[0];
        var last = this.heap.pop();
        if (this.heap.length) {
          this.heap[0] = last;
          this._sinkDown(0);
        }
        return top;
      };

      MinHeap.prototype._bubbleUp = function (i) {
        var heap = this.heap;
        while (i > 0) {
          var p = (i - 1) >> 1;
          if (heap[p].dist <= heap[i].dist) break;
          var tmp = heap[p];
          heap[p] = heap[i];
          heap[i] = tmp;
          i = p;
        }
      };

      MinHeap.prototype._sinkDown = function (i) {
        var heap = this.heap;
        var n = heap.length;
        while (true) {
          var l = i * 2 + 1;
          var r = l + 1;
          var smallest = i;
          if (l < n && heap[l].dist < heap[smallest].dist) smallest = l;
          if (r < n && heap[r].dist < heap[smallest].dist) smallest = r;
          if (smallest === i) break;
          var tmp = heap[i];
          heap[i] = heap[smallest];
          heap[smallest] = tmp;
          i = smallest;
        }
      };

      function addEdge(graph, from, to, weight, meta) {
        if (!graph[from]) graph[from] = [];
        var edges = graph[from];
        for (var i = 0; i < edges.length; i++) {
          if (edges[i].node === to) {
            if (weight < edges[i].weight) {
              edges[i].weight = weight;
              edges[i].meta = meta || {};
            }
            return;
          }
        }
        edges.push({ node: to, weight: weight, meta: meta || {} });
      }

      function addSegmentToGraph(graph, nodeIndex, ax, ay, bx, by, meta) {
        var aId = nodeIndex.getId(ax, ay);
        var bId = nodeIndex.getId(bx, by);
        var w = fastDist(ax, ay, bx, by);
        if (w <= 0) return;
        addEdge(graph, aId, bId, w, meta);
        addEdge(graph, bId, aId, w, meta);
      }

      function ensureBidirectionalGraph(graph) {
        var keys = Object.keys(graph);
        for (var k = 0; k < keys.length; k++) {
          var from = Number(keys[k]);
          var edges = graph[from];
          if (!edges) continue;
          for (var i = 0; i < edges.length; i++) {
            var e = edges[i];
            var to = e.node;
            var w = e.weight;
            var meta = e.meta;
            if (!graph[to]) graph[to] = [];
            var rev = graph[to];
            var found = false;
            for (var j = 0; j < rev.length; j++) {
              if (rev[j].node === from) {
                found = true;
                if (w < rev[j].weight) rev[j].weight = w;
                break;
              }
            }
            if (!found) {
              rev.push({ node: from, weight: w, meta: meta });
            }
          }
        }
      }

      function processFeatureIntoGraph(feature, graph, nodeIndex) {
        var geom = feature.geometry;
        if (!geom || !geom.paths) return;
        var meta = { feature: feature };

        for (var p = 0; p < geom.paths.length; p++) {
          var path = geom.paths[p];
          for (var i = 0; i < path.length - 1; i++) {
            addSegmentToGraph(
              graph, nodeIndex,
              path[i][0], path[i][1],
              path[i + 1][0], path[i + 1][1],
              meta
            );
          }
        }
      }

      function buildGraphAsync(features) {
        var graph = {};
        var nodeIndex = new NodeIndex(CONNECT_TOLERANCE_M);
        var idx = 0;

        return new Promise(function (resolve) {
          function step() {
            var end = Math.min(idx + GRAPH_CHUNK_SIZE, features.length);
            for (; idx < end; idx++) {
              processFeatureIntoGraph(features[idx], graph, nodeIndex);
            }
            if (idx < features.length) {
              setTimeout(step, 0);
            } else {
              ensureBidirectionalGraph(graph);
              resolve({ graph: graph, nodeIndex: nodeIndex });
            }
          }
          step();
        });
      }

      function findNearestSegment(point, features) {
        var px = point.x;
        var py = point.y;
        var best = null;
        var bestDist = Infinity;

        for (var f = 0; f < features.length; f++) {
          var geom = features[f].geometry;
          if (!geom || !geom.paths) continue;

          for (var p = 0; p < geom.paths.length; p++) {
            var path = geom.paths[p];
            for (var i = 0; i < path.length - 1; i++) {
              var ax = path[i][0];
              var ay = path[i][1];
              var bx = path[i + 1][0];
              var by = path[i + 1][1];
              var hit = nearestOnSegment(px, py, ax, ay, bx, by);
              if (hit.dist < bestDist) {
                bestDist = hit.dist;
                best = {
                  feature: features[f],
                  coordinate: { x: hit.x, y: hit.y, spatialReference: point.spatialReference },
                  a: path[i],
                  b: path[i + 1],
                  distance: hit.dist
                };
              }
            }
          }
        }

        return best;
      }

      function insertSnapOnGraph(graph, nodeIndex, snap) {
        var sx = snap.coordinate.x;
        var sy = snap.coordinate.y;
        var snapId = nodeIndex.getId(sx, sy);
        var aId = nodeIndex.getId(snap.a[0], snap.a[1]);
        var bId = nodeIndex.getId(snap.b[0], snap.b[1]);
        var lenA = fastDist(sx, sy, snap.a[0], snap.a[1]);
        var lenB = fastDist(sx, sy, snap.b[0], snap.b[1]);
        var meta = { feature: snap.feature };

        addEdge(graph, snapId, aId, lenA, meta);
        addEdge(graph, aId, snapId, lenA, meta);
        addEdge(graph, snapId, bId, lenB, meta);
        addEdge(graph, bId, snapId, lenB, meta);
        return snapId;
      }

      function connectVirtualNode(graph, nodeIndex, virtualId, clickPoint, snapInfo) {
        if (!snapInfo || !snapInfo.coordinate) return null;
        var snapId = insertSnapOnGraph(graph, nodeIndex, snapInfo);
        var distClickToSnap = fastDist(
          clickPoint.x, clickPoint.y,
          snapInfo.coordinate.x, snapInfo.coordinate.y
        );
        addEdge(graph, virtualId, snapId, distClickToSnap, { virtual: true });
        addEdge(graph, snapId, virtualId, distClickToSnap, { virtual: true });
        if (!graph[virtualId]) graph[virtualId] = [];
        return snapId;
      }

      function dijkstra(graph, startId, endId) {
        var dist = [];
        var prev = [];
        var visited = [];
        var heap = new MinHeap();
        dist[startId] = 0;
        heap.push({ id: startId, dist: 0 });

        while (heap.heap.length) {
          var cur = heap.pop();
          var u = cur.id;
          if (visited[u]) continue;
          visited[u] = true;
          if (u === endId) break;
          if (cur.dist > dist[u]) continue;

          var edges = graph[u];
          if (!edges) continue;

          for (var i = 0; i < edges.length; i++) {
            var edge = edges[i];
            var v = edge.node;
            var alt = dist[u] + edge.weight;
            if (dist[v] === undefined || alt < dist[v]) {
              dist[v] = alt;
              prev[v] = { node: u, meta: edge.meta };
              heap.push({ id: v, dist: alt });
            }
          }
        }

        if (dist[endId] === undefined || !isFinite(dist[endId])) return null;

        var pathIds = [];
        var node = endId;
        var guard = 0;
        while (node !== undefined && guard++ < 500000) {
          pathIds.unshift(node);
          if (node === startId) break;
          var step = prev[node];
          if (!step) break;
          node = step.node;
        }
        return { ids: pathIds, distance: dist[endId], prev: prev };
      }

      function buildRoutePolyline(pathIds, nodeIndex, fromPoint, toPoint) {
        var coords = [[fromPoint.x, fromPoint.y]];
        for (var i = 0; i < pathIds.length; i++) {
          var id = pathIds[i];
          if (id === START_NODE_ID || id === END_NODE_ID) continue;
          var n = nodeIndex.nodes[id];
          if (!n) continue;
          coords.push([n.x, n.y]);
        }
        coords.push([toPoint.x, toPoint.y]);

        var cleaned = [coords[0]];
        for (var j = 1; j < coords.length; j++) {
          var p = cleaned[cleaned.length - 1];
          var c = coords[j];
          if (Math.abs(p[0] - c[0]) > 0.01 || Math.abs(p[1] - c[1]) > 0.01) {
            cleaned.push(c);
          }
        }

        return new Polyline({
          paths: [cleaned],
          spatialReference: view.spatialReference
        });
      }

      function queryRoadsInExtent(extent) {
        var allFeatures = [];
        var offset = 0;

        function fetchPage() {
          var q = new Query({
            geometry: extent,
            spatialRelationship: "intersects",
            returnGeometry: true,
            outFields: ["fid", "name", "fclass_cn", "ref", "oneway"],
            num: QUERY_PAGE_SIZE,
            start: offset
          });
          return roadLayer.queryFeatures(q).then(function (result) {
            var batch = result.features || [];
            allFeatures = allFeatures.concat(batch);
            if (result.exceededTransferLimit && batch.length >= QUERY_PAGE_SIZE) {
              offset += QUERY_PAGE_SIZE;
              return fetchPage();
            }
            return allFeatures;
          });
        }

        return fetchPage();
      }

      function queryRoadsNearPoint(point, radiusM) {
        var buffer = geometryEngine.geodesicBuffer(point, radiusM, "meters");
        return queryRoadsInExtent(buffer.extent);
      }

      function getRouteSearchExtent(p1, p2) {
        var line = new Polyline({
          paths: [[[p1.x, p1.y], [p2.x, p2.y]]],
          spatialReference: view.spatialReference
        });
        var directDist = geometryEngine.distance(p1, p2, "meters");
        var bufferDist = Math.max(
          MIN_SEARCH_BUFFER_M,
          directDist * 0.55 + snapSearchRadiusM * 2
        );
        var buffered = geometryEngine.geodesicBuffer(line, bufferDist, "meters");
        return buffered.extent;
      }

      function getCombinedRouteExtent(p1, p2) {
        var main = getRouteSearchExtent(p1, p2);
        var bufA = geometryEngine.geodesicBuffer(p1, snapSearchRadiusM, "meters");
        var bufB = geometryEngine.geodesicBuffer(p2, snapSearchRadiusM, "meters");
        var combined = main.clone();
        combined.union(bufA.extent);
        combined.union(bufB.extent);
        return combined;
      }

      function showSnapBuffer(point, radiusM) {
        snapBufferLayer.removeAll();
        var circle = geometryEngine.geodesicBuffer(point, radiusM, "meters");
        snapBufferLayer.add(new Graphic({
          geometry: circle,
          symbol: {
            type: "simple-fill",
            color: [25, 118, 210, 0.08],
            outline: { color: [25, 118, 210, 0.45], width: 1.5 }
          }
        }));
      }

      function featureId(f) {
        var a = f.attributes || {};
        return a.fid != null ? a.fid : (a.OBJECTID != null ? a.OBJECTID : f.uid);
      }

      function mergeFeaturesByFid(listA, listB) {
        var map = {};
        listA.forEach(function (f) { map[featureId(f)] = f; });
        listB.forEach(function (f) { map[featureId(f)] = f; });
        return Object.keys(map).map(function (k) { return map[k]; });
      }

      function snapPointToRoad(clickPoint) {
        return queryRoadsNearPoint(clickPoint, snapSearchRadiusM).then(function (features) {
          var snap = findNearestSegment(clickPoint, features);
          if (!snap || snap.distance > snapSearchRadiusM) {
            return { ok: false, features: features, distance: snap ? snap.distance : null };
          }
          return {
            ok: true,
            point: snap.coordinate,
            snap: snap,
            features: features,
            roadName: roadLabel(snap.feature.attributes),
            distance: snap.distance
          };
        });
      }

      function updateStopGraphics() {
        stopLayer.removeAll();
        if (startPoint) {
          stopLayer.add(new Graphic({ geometry: startPoint, symbol: startSymbol }));
        }
        if (endPoint) {
          stopLayer.add(new Graphic({ geometry: endPoint, symbol: endSymbol }));
        }
      }

      function clearRoute() {
        startPoint = null;
        endPoint = null;
        startSnapInfo = null;
        endSnapInfo = null;
        routeLayer.removeAll();
        stopLayer.removeAll();
        snapBufferLayer.removeAll();
        routePanel.classList.remove("visible");
        setRouteStatus("请点击地图选择起点（A）");
      }

      function showRouteResult(distanceM, nodeCount, roadNames) {
        var km = (distanceM / 1000).toFixed(2);
        routePanelContent.innerHTML =
          '<p class="route-stat"><strong>路径总长：</strong>' + km + " 公里（" + Math.round(distanceM) + " 米）</p>" +
          '<p class="route-stat"><strong>途经节点：</strong>' + nodeCount + " 个</p>" +
          (roadNames.length
            ? '<p class="route-stat"><strong>主要道路：</strong>' + roadNames.slice(0, 5).join("、") + (roadNames.length > 5 ? " 等" : "") + "</p>"
            : "");
        routePanel.classList.add("visible");
      }

      function collectRoadNames(pathIds, prev) {
        var names = [];
        var seen = {};
        for (var i = 1; i < pathIds.length; i++) {
          var meta = prev[pathIds[i]] && prev[pathIds[i]].meta;
          if (meta && meta.feature && !meta.virtual) {
            var a = meta.feature.attributes;
            var n = a.name || a.ref || a.fclass_cn;
            if (n && !seen[n]) {
              seen[n] = true;
              names.push(n);
            }
          }
        }
        return names;
      }

      function computeRouteFromFeatures(features) {
        return buildGraphAsync(features).then(function (net) {
          setRouteStatus("道路网已构建，正在计算最短路径…");
          return yieldToUI().then(function () {
            var graph = net.graph;
            var nodeIndex = net.nodeIndex;
            graph[START_NODE_ID] = graph[START_NODE_ID] || [];
            graph[END_NODE_ID] = graph[END_NODE_ID] || [];

            if (!connectVirtualNode(graph, nodeIndex, START_NODE_ID, startPoint, startSnapInfo) ||
                !connectVirtualNode(graph, nodeIndex, END_NODE_ID, endPoint, endSnapInfo)) {
              return { error: "connect" };
            }

            return yieldToUI().then(function () {
              return dijkstra(graph, START_NODE_ID, END_NODE_ID);
            }).then(function (result) {
              if (!result) return { error: "noPath", featureCount: features.length };
              var pathIds = result.ids.filter(function (id) {
                return id !== START_NODE_ID && id !== END_NODE_ID;
              });
              if (pathIds.length < 1) return { error: "short" };
              return {
                result: result,
                pathIds: pathIds,
                nodeIndex: nodeIndex,
                featureCount: features.length
              };
            });
          });
        });
      }

      function runRoutePlan() {
        if (!startPoint || !endPoint || !startSnapInfo || !endSnapInfo || isRouting) return;
        isRouting = true;
        setRouteStatus("正在加载道路数据…");
        routeLayer.removeAll();
        routePanel.classList.remove("visible");
        snapBufferLayer.removeAll();

        var combinedExtent = getCombinedRouteExtent(startPoint, endPoint);

        queryRoadsInExtent(combinedExtent).then(function (features) {
          if (!features.length) {
            setRouteStatus("规划范围内未查询到道路，请增大吸附半径或换一组点位。");
            return;
          }

          setRouteStatus("已加载 " + features.length + " 条道路，正在构建路网（" + CONNECT_TOLERANCE_M + " 米容差）…");

          return computeRouteFromFeatures(features);
        }).then(function (out) {
          if (!out) return;

          if (out.error === "connect") {
            setRouteStatus("起终点无法接入道路网，请重新选点。");
            return;
          }
          if (out.error === "noPath") {
            setRouteStatus(
              "未能连通起终点（已加载 " + out.featureCount + " 条道路，容差 " + CONNECT_TOLERANCE_M + " 米）。" +
              "可增大<strong>道路吸附</strong>半径后重试。"
            );
            return;
          }
          if (out.error === "short") {
            setRouteStatus("路径过短或无法生成有效路线。");
            return;
          }

          var routeLine = buildRoutePolyline(out.pathIds, out.nodeIndex, startPoint, endPoint);
          routeLayer.add(new Graphic({ geometry: routeLine, symbol: routeSymbol }));

          var roadNames = collectRoadNames(out.result.ids, out.result.prev);
          showRouteResult(out.result.distance, out.pathIds.length, roadNames);
          setRouteStatus(
            "规划完成：约 <strong>" + (out.result.distance / 1000).toFixed(2) +
            " 公里</strong>（路网 " + out.featureCount + " 段，节点容差 " + CONNECT_TOLERANCE_M + " 米）。"
          );

          return view.goTo(routeLine.extent.expand(1.4));
        }).catch(function (err) {
          console.error(err);
          setRouteStatus("路径规划失败，请检查 GeoScene 服务或网络连接。");
        }).finally(function () {
          isRouting = false;
        });
      }

      function applySnappedPoint(mapPoint, isStart) {
        isSnapping = true;
        var label = isStart ? "起点" : "终点";
        setRouteStatus("正在 " + snapSearchRadiusM + " 米范围内搜索最近道路…");
        showSnapBuffer(mapPoint, snapSearchRadiusM);

        return snapPointToRoad(mapPoint).then(function (res) {
          if (!res.ok) {
            var hint = res.distance != null
              ? "最近道路约 " + Math.round(res.distance) + " 米外。"
              : "未找到道路线。";
            setRouteStatus(
              label + "吸附失败：" + hint + "请增大搜索半径或靠近道路后重试。"
            );
            if (isStart) {
              startPoint = null;
              startSnapInfo = null;
            } else {
              endPoint = null;
              endSnapInfo = null;
            }
            updateStopGraphics();
            return false;
          }

          var snapped = new Point({
            x: res.point.x,
            y: res.point.y,
            spatialReference: view.spatialReference
          });

          if (isStart) {
            startPoint = snapped;
            startSnapInfo = res.snap;
            endPoint = null;
            endSnapInfo = null;
            routeLayer.removeAll();
            routePanel.classList.remove("visible");
            updateStopGraphics();
            setRouteStatus(
              "起点已吸附至 <strong>" + res.roadName + "</strong>（距点击处 " +
              Math.round(res.distance) + " 米），请选择终点（B）。"
            );
          } else {
            endPoint = snapped;
            endSnapInfo = res.snap;
            updateStopGraphics();
            setRouteStatus(
              "终点已吸附至 <strong>" + res.roadName + "</strong>（距点击处 " +
              Math.round(res.distance) + " 米），正在规划…"
            );
            runRoutePlan();
          }
          return true;
        }).catch(function (err) {
          console.error(err);
          setRouteStatus(label + "搜索道路失败，请检查网络。");
          return false;
        }).finally(function () {
          isSnapping = false;
        });
      }

      function handleMapClick(mapPoint) {
        if (isRouting || isSnapping) return;

        if (!startPoint) {
          applySnappedPoint(mapPoint, true);
          return;
        }

        if (!endPoint) {
          applySnappedPoint(mapPoint, false);
          return;
        }

        startPoint = null;
        endPoint = null;
        startSnapInfo = null;
        endSnapInfo = null;
        routeLayer.removeAll();
        routePanel.classList.remove("visible");
        applySnappedPoint(mapPoint, true);
      }

      document.getElementById("basemapSelector").addEventListener("change", function (e) {
        map.basemap = e.target.value;
      });

      document.getElementById("layerBoundary").addEventListener("change", function (e) {
        boundaryLayer.visible = e.target.checked;
      });

      document.getElementById("layerRoad").addEventListener("change", function (e) {
        roadLayer.visible = e.target.checked;
      });

      document.getElementById("btnClearRoute").addEventListener("click", clearRoute);

      document.getElementById("btnPlanByCoord").addEventListener("click", planRouteFromCoordinateInputs);

      document.getElementById("snapRadius").addEventListener("input", function (e) {
        snapSearchRadiusM = Number(e.target.value);
        document.getElementById("snapRadiusLabel").textContent =
          "搜索半径：" + snapSearchRadiusM + " 米";
      });

      view.on("pointer-move", function (evt) {
        var p = view.toMap(evt);
        if (!p) return;
        document.getElementById("mouseCoord").textContent =
          "经度 " + p.longitude.toFixed(5) + "°　纬度 " + p.latitude.toFixed(5) + "°";
      });

      view.when(function () {
        view.on("click", function (event) {
          handleMapClick(event.mapPoint);
        });
        return boundaryLayer.when(function () {
          return boundaryLayer.queryExtent();
        });
      }).then(function (result) {
        if (result && result.extent && !result.extent.isEmpty) {
          return view.goTo(result.extent.expand(1.1));
        }
      });
    });
  </script>
</body>
