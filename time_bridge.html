<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>贵州桥梁建设编年史 · 交互式地图叙事</title>
  <!-- Font Awesome 图标（CDN，无本地图片） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <style>
    /* ========== 桥梁主题配色（钢灰、混凝土、江蓝、锈橙） ========== */
    :root {
      --bg-deep: #3d4a56;
      --bg-warm: #5c6b7a;
      --bg-panel: #f4f1eb;
      --steel: #6b7d8f;
      --steel-dark: #4a5d6e;
      --river-blue: #4a7c9b;
      --rust: #b85c38;
      --rust-light: #d4845c;
      --concrete: #e8e4dc;
      --forest: #5a7a5c;
      --text-primary: #2c3338;
      --text-muted: #5c6570;
      --border-soft: 1px solid #a8b4c0;
      --shadow-soft: 0 4px 16px rgba(44, 51, 56, 0.12);
      --header-h: 68px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #4a5d6e 0%, #5c6b7a 45%, #6b7d8f 100%);
      color: var(--text-primary);
      min-height: 100vh;
      overflow: hidden;
    }

    .app-header {
      position: relative;
      z-index: 10;
      height: var(--header-h);
      padding: 6px 24px;
      text-align: center;
      border-bottom: var(--border-soft);
      background: linear-gradient(180deg, #f4f1eb, #e8e4dc);
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .app-header h1 {
      font-size: 1.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      line-height: 1.15;
      color: var(--steel-dark);
      white-space: nowrap;
    }

    .app-header p {
      font-size: 0.88rem;
      line-height: 1.2;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ========== 主布局：地图自适应撑满 + 固定宽度侧栏 ========== */
    .main-layout {
      display: flex;
      height: calc(100vh - var(--header-h) - 130px);
      position: relative;
      z-index: 1;
    }

    .map-wrapper {
      flex: 1 1 auto;
      min-width: 0;
      position: relative;
      padding: 8px 8px 8px 12px;
    }

    .map-frame {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      border: var(--border-soft);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .map-frame.loaded {
      opacity: 1;
      transform: scale(1);
    }

    #mapContainer {
      width: 100%;
      height: 100%;
    }

    /* 地图上方实时经纬度显示 */
    .map-coord-bar {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 110;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
      color: var(--steel-dark);
      background: rgba(244, 241, 235, 0.96);
      border: 1px solid var(--steel);
      border-radius: 6px;
      box-shadow: var(--shadow-soft);
      pointer-events: none;
      white-space: nowrap;
    }

    .map-coord-bar i {
      color: var(--river-blue);
      font-size: 0.85rem;
    }

    /* 地图左侧桥梁图片弹窗 */
    .bridge-img-popup {
      position: absolute;
      left: 24px;
      top: 50%;
      transform: translateY(-50%) translateX(-12px);
      z-index: 105;
      width: 280px;
      background: var(--bg-panel);
      border: var(--border-soft);
      border-radius: 10px;
      box-shadow: var(--shadow-soft);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease, transform 0.4s ease, visibility 0.4s;
      pointer-events: auto;
    }

    .bridge-img-popup.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(-50%) translateX(0);
    }

    .bridge-img-popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: linear-gradient(180deg, #e8e4dc, #f4f1eb);
      border-bottom: var(--border-soft);
    }

    .bridge-img-popup-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--steel-dark);
      line-height: 1.3;
      flex: 1;
      padding-right: 8px;
    }

    .bridge-img-popup-year {
      font-size: 0.7rem;
      color: #fff;
      background: var(--rust);
      padding: 2px 8px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .bridge-img-popup-body {
      position: relative;
      width: 100%;
      min-height: 160px;
      background: #d4cfc4;
    }

    .bridge-img-popup-body img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 220px;
      object-fit: cover;
      vertical-align: middle;
    }

    .bridge-img-popup-loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      background: #e8e4dc;
    }

    .bridge-img-popup-error {
      padding: 24px 16px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* 控制按钮组 */
    .map-controls {
      position: absolute;
      top: 24px;
      left: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 100;
    }

    .btn-tech {
      padding: 8px 14px;
      font-size: 0.75rem;
      color: var(--steel-dark);
      background: rgba(244, 241, 235, 0.95);
      border: 1px solid var(--steel);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.25s ease;
      backdrop-filter: blur(4px);
    }

    .btn-tech:hover {
      background: #fff;
      border-color: var(--river-blue);
      color: var(--river-blue);
      transform: translateY(-1px);
    }

    .btn-tech.active {
      background: var(--rust);
      border-color: var(--rust);
      color: #fff;
    }

    /* ========== 右侧信息面板（固定宽度，地图占据剩余空间） ========== */
    .info-panel {
      flex: 0 0 240px;
      width: 240px;
      padding: 8px 12px 8px 0;
      display: flex;
      flex-direction: column;
    }

    .panel-card {
      flex: 1;
      background: var(--bg-panel);
      border: var(--border-soft);
      border-radius: 10px;
      padding: 16px;
      box-shadow: var(--shadow-soft);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: border-color 0.35s ease, box-shadow 0.35s ease;
    }

    .panel-card.highlight {
      border-color: var(--rust);
      box-shadow: 0 4px 20px rgba(184, 92, 56, 0.2);
    }

    .bridge-icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e8e4dc, #d4cfc4);
      border: 2px solid var(--steel);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
      color: var(--rust);
      margin-bottom: 12px;
    }

    .year-badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 0.8rem;
      color: var(--rust);
      border: 1px solid var(--rust-light);
      background: rgba(184, 92, 56, 0.08);
      border-radius: 20px;
      margin-bottom: 8px;
      letter-spacing: 0.06em;
    }

    .bridge-title {
      font-size: 1.15rem;
      margin-bottom: 10px;
      color: var(--text-primary);
      line-height: 1.35;
    }

    .bridge-meta {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .bridge-desc {
      flex: 1;
      font-size: 0.9rem;
      line-height: 1.75;
      color: var(--text-muted);
      overflow-y: auto;
      padding-right: 8px;
    }

    .bridge-desc::-webkit-scrollbar { width: 4px; }
    .bridge-desc::-webkit-scrollbar-thumb {
      background: var(--steel);
      border-radius: 4px;
    }

    /* ========== 底部时间轴（年份与滑条两端/刻度对齐） ========== */
    .timeline-section {
      position: relative;
      z-index: 10;
      height: 130px;
      padding: 10px 24px 16px;
      background: linear-gradient(0deg, #e8e4dc, #f4f1eb);
      border-top: var(--border-soft);
    }

    .timeline-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      padding: 0 11px; /* 与滑块 thumb 半宽对齐 */
    }

    .timeline-track-wrap {
      position: relative;
      padding: 10px 11px 40px; /* 左右 padding 使滑块与刻度对齐 */
    }

    input[type="range"]#yearSlider {
      width: 100%;
      height: 8px;
      -webkit-appearance: none;
      appearance: none;
      background: linear-gradient(90deg, var(--steel) 0%, var(--river-blue) 50%, var(--rust-light) 100%);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]#yearSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--rust);
      border: 2px solid #fff;
      box-shadow: 0 2px 8px rgba(44, 51, 56, 0.25);
      cursor: grab;
      transition: transform 0.2s;
    }

    input[type="range"]#yearSlider::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }

    input[type="range"]#yearSlider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--rust);
      border: 2px solid #fff;
      cursor: grab;
    }

    /* 年份刻度：按 2000–2025 比例绝对定位，与滑条对齐 */
    .year-ticks {
      position: absolute;
      left: 11px;
      right: 11px;
      bottom: 4px;
      height: 32px;
      pointer-events: none;
    }

    .year-tick {
      position: absolute;
      transform: translateX(-50%);
      padding: 3px 6px;
      font-size: 0.65rem;
      color: var(--text-muted);
      background: rgba(244, 241, 235, 0.95);
      border: 1px solid #c5cdd5;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      pointer-events: auto;
    }

    .year-tick:hover,
    .year-tick.active {
      color: #fff;
      background: var(--rust);
      border-color: var(--rust);
    }

    .current-year-display {
      flex: 1;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--rust);
    }

    /* 百度地图信息窗口自定义样式 */
    .BMap_bubble_pop,
    .BMap_bubble_content {
      background: transparent !important;
      border: none !important;
    }

    /* 地图弹窗：加宽、不限行数，过长时内部滚动 */
    .BMap_bubble_pop > img,
    .BMap_bubble_pop .BMap_bubble_top img {
      display: none;
    }

    .BMap_bubble_content {
      overflow-x: hidden !important;
      overflow-y: auto !important;
      max-height: 520px !important;
      height: auto !important;
    }

    .custom-infowindow {
      width: 380px;
      box-sizing: border-box;
      padding: 16px 18px;
      background: #f4f1eb;
      border: 1px solid #a8b4c0;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(44, 51, 56, 0.15);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.75;
    }

    .custom-infowindow h4 {
      color: var(--steel-dark);
      margin-bottom: 8px;
      font-size: 16px;
      line-height: 1.35;
    }

    .custom-infowindow .iw-tag {
      display: inline-block;
      color: var(--rust);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      padding: 2px 8px;
      background: rgba(184, 92, 56, 0.1);
      border-radius: 4px;
    }

    .custom-infowindow .iw-body {
      margin: 0;
      white-space: normal;
      word-break: break-word;
      max-height: none;
      overflow: visible;
    }

    .custom-infowindow .iw-note {
      font-size: 11px;
      color: #5a7a5c;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #c5cdd5;
    }

    .loading-overlay {
      position: absolute;
      inset: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(244, 241, 235, 0.85);
      border-radius: 10px;
      z-index: 50;
      transition: opacity 0.5s;
    }

    .loading-overlay.hidden { opacity: 0; pointer-events: none; }

    .loader {
      width: 44px;
      height: 44px;
      border: 3px solid #d4cfc4;
      border-top-color: var(--rust);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .ak-hint {
      font-size: 0.62rem;
      color: #8b5a3c;
      margin-top: 8px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>贵州桥梁建设编年史</h1>
    <p>2000 — 2025 · 黔山天堑变通途 · 交互式地图叙事</p>
  </header>

  <div class="main-layout">
    <!-- 地图区域（自适应撑满中间区域） -->
    <div class="map-wrapper">
      <div class="map-controls">
        <button class="btn-tech" id="btnPlay" title="自动逐年播放"><i class="fas fa-play"></i> 播放动画</button>
        <button class="btn-tech" id="btnReset" title="恢复贵州省全景"><i class="fas fa-compress-arrows-alt"></i> 重置地图</button>
        <button class="btn-tech" id="btnMapMode" title="切换普通/卫星/三维"><i class="fas fa-layer-group"></i> 切换地图模式</button>
      </div>

      <div class="map-controls" style="top: auto; bottom: 24px; left: 24px;">
        <span class="btn-tech" id="mapModeLabel" style="cursor: default;">模式：普通</span>
      </div>

      <div class="loading-overlay" id="loadingOverlay">
        <div class="loader"></div>
      </div>

      <!-- 左侧桥梁图片弹窗：跳转桥梁时展示对应实景图 -->
      <div class="bridge-img-popup" id="bridgeImgPopup">
        <div class="bridge-img-popup-header">
          <span class="bridge-img-popup-title" id="bridgeImgTitle">桥梁名称</span>
          <span class="bridge-img-popup-year" id="bridgeImgYear">2000</span>
        </div>
        <div class="bridge-img-popup-body" id="bridgeImgBody">
          <div class="bridge-img-popup-loading" id="bridgeImgLoading">图片加载中…</div>
          <img id="bridgeImgEl" alt="桥梁实景图" />
        </div>
      </div>

      <div class="map-frame" id="mapFrame">
        <div class="map-coord-bar" id="mapCoordBar">
          <i class="fas fa-crosshairs"></i>
          <span id="mapCoordText">经度 —°　纬度 —°</span>
        </div>
        <div id="mapContainer"></div>
      </div>
    </div>

    <!-- 右侧信息面板（固定 240px 宽） -->
    <aside class="info-panel">
      <div class="panel-card" id="infoPanel">
        <div class="bridge-icon-wrap" id="bridgeYearShort">00</div>
        <span class="year-badge" id="displayYear">2000</span>
        <h2 class="bridge-title" id="displayName">请选择年份</h2>
        <p class="bridge-meta" id="displayMeta">拖动时间轴或点击年份按钮探索贵州桥梁发展史</p>
        <div class="bridge-desc" id="displayDesc">
          本页面汇集贵州代表性桥梁建设节点，涵盖北盘江、坝陵河、平塘特大桥等标志性工程。
          通过底部时间轴可纵览2000年至2025年间黔地交通基础设施的跨越式发展。
          点击「播放动画」可自动逐年浏览贵州桥梁建设历程。
        </div>
        <p class="ak-hint" id="akHint"></p>
      </div>
    </aside>
  </div>

  <!-- 底部时间轴 -->
  <section class="timeline-section">
    <div class="timeline-label">
      <span>2000</span>
      <span class="current-year-display" id="sliderYearText">2000 年</span>
      <span>2025</span>
    </div>
    <div class="timeline-track-wrap">
      <input type="range" id="yearSlider" min="2000" max="2025" value="2000" step="1" />
      <div class="year-ticks" id="yearTicks"></div>
    </div>
  </section>

  <!--
    百度地图 JavaScript API（WebGL 版，对应 v3.0 三维能力）
    请将 YOUR_BAIDU_MAP_AK 替换为您在百度地图开放平台申请的密钥；
    下方已按用户提供的示例写入密钥，部署时可自行更换。
  -->
  <script src="https://api.map.baidu.com/api?type=webgl&v=1.0&ak=xhldCkmJHJM7LEs1fvSpe7z5lILxF8MF"></script>

  <script>
    /* ============================================================
     * 贵州代表性桥梁数据集
     * 字段：year, actualYear, name, lng, lat, type, icon, desc（右侧栏介绍）
     *       popupDesc（地图弹窗专用，侧重为民服务，与 desc 内容不同）
     *       image（左侧图片弹窗实景图 URL）
     * 坐标为桥梁大致中心点，便于地图定位
     * ============================================================ */
    const BRIDGES = [
      {
        year: 2000,
        actualYear: 2000,
        name: "红枫湖大桥",
        lng: 106.4463,
        lat: 26.5340,
        type: "公路桥",
        icon: "fa-water",
        note: "",
        desc: "红枫湖大桥坐落于贵阳清镇红枫湖风景区，是早期连接湖区两岸的重要通道。桥梁横跨烟波浩渺的红枫湖，与喀斯特山水融为一体，成为黔中旅游区交通节点。其建设改善了环湖路网，为后续贵黄、沪昆等干线通道储备了区域联通经验，是贵州21世纪初公路桥梁建设的代表性作品之一。",
        popupDesc: "【便民出行】环湖村寨村民去清镇、贵阳卖农货、就医不必再绕远路乘船或走崎岖山路。【旅游服务】游客从贵阳方向直达红枫湖、百花湖景区，周末自驾一日游更加便捷。【应急保障】雨季库区水位变化时，桥梁为两岸群众提供稳定陆路通道，便于防汛疏散与救援车辆通行。",
        image: "https://pic.nximg.cn/20111016/4874198_215857631142_2.jpg"
      },
      {
        year: 2002,
        actualYear: 2001,
        name: "六广河大桥",
        lng: 106.4413,
        lat: 27.0042,
        type: "公路大桥",
        icon: "fa-road",
        note: "实际于2001年建成通车，编年史中标注为2002年以便时间轴分布。",
        desc: "六广河大桥位于贵阳市修文县与黔西市交界处，跨越六广河峡谷，是贵毕公路上的控制性工程。桥址峡谷深切、地形险峻，建设时期代表了贵州山区跨河桥梁在勘察设计、高墩大跨方面的技术积累。通车后显著缩短了贵阳北部与毕节方向的行车时间，对促进黔西北资源开发与物流畅通具有重要作用。",
        popupDesc: "【通勤省时】贵阳北部居民前往修文、黔西、毕节方向，行车时间较建桥前大幅缩短，日常上班、探亲更为方便。【物流畅通】沿线蔬菜、煤炭、建材等物资可经大桥快速外运，降低运输成本，惠及农户与小微商户。【山区惠民】峡谷两岸乡镇学生上学、老人看病不必再翻山涉水，客车、救护车均可直达。",
        image: "https://www.ctnews.com.cn/dcgz2023/pic/2023-06/20/143722_12bea5c2-4f3e-4a7e-926f-1695204d393b.jpeg"
      },
      {
        year: 2004,
        actualYear: 2004,
        name: "马岭河大桥",
        lng: 104.9576,
        lat: 25.1595,
        type: "峡谷公路桥",

    /* ---------- 按年份索引，便于滑块查找最近桥梁 ---------- */
    const bridgeByYear = {};
    BRIDGES.forEach((b) => { bridgeByYear[b.year] = b; });
    const bridgeYears = BRIDGES.map((b) => b.year).sort((a, b) => a - b);

    /* ---------- 全局状态 ---------- */
    let map = null;
    let markers = [];
    let infoWindow = null;
    let currentBridgeIndex = 0;
    let mapModeIndex = 0; // 0普通 1卫星 2三维倾斜
    const mapModes = ["普通", "卫星", "三维"];
    let playTimer = null;
    let isPlaying = false;
    const INITIAL_CENTER = { lng: 106.55, lat: 26.35 };
    const INITIAL_ZOOM = 8;
    const TIMELINE_MIN = 2000;
    const TIMELINE_MAX = 2025;

    /** 将年份映射为时间轴上的百分比位置（0% = 2000，100% = 2025） */
    function yearToPercent(year) {
      return ((year - TIMELINE_MIN) / (TIMELINE_MAX - TIMELINE_MIN)) * 100;
    }

    /**
     * 根据滑块年份找到对应或最近的桥梁索引
     */
    function findBridgeIndexByYear(year) {
      if (bridgeByYear[year]) {
        return BRIDGES.findIndex((b) => b.year === year);
      }
      let closest = 0;
      let minDiff = Infinity;
      BRIDGES.forEach((b, i) => {
        const d = Math.abs(b.year - year);
        if (d < minDiff) {
          minDiff = d;
          closest = i;
        }
      });
      return closest;
    }

    /** 生成 SVG 发光标记 Data URL */
    function getMarkerIconUrl(isActive) {
      const color = isActive ? "#ff2d95" : "#00f5ff";
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="14" fill="${color}" opacity="0.25"/>
        <circle cx="16" cy="16" r="10" fill="${color}" opacity="0.5"/>
        <circle cx="16" cy="16" r="6" fill="${color}" stroke="#fff" stroke-width="2"/>
      </svg>`;
      return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.trim());
    }

    function createMarkerIcon(isActive) {
      return new BMapGL.Icon(getMarkerIconUrl(isActive), new BMapGL.Size(32, 32), {
        anchor: new BMapGL.Size(16, 16)
      });
    }

    /**
     * 信息窗口 HTML（科技感样式）
     */
    const INFO_WINDOW_WIDTH = 400;

    /**
     * 地图弹窗（popupDesc：为民服务，与右侧 desc 不同，全文展示）
     */
    function buildInfoWindowContent(bridge) {
      const noteHtml = bridge.note
        ? `<p class="iw-note">※ ${bridge.note}</p>`
        : "";
      return `
        <div class="custom-infowindow">
          <span class="iw-tag">${bridge.year} 年 · 为民服务</span>
          <h4>${bridge.name}</h4>
          <p class="iw-body">${bridge.popupDesc}</p>
          ${noteHtml}
        </div>`;
    }

    /** 按内容高度自适应弹窗，避免文字被裁切 */
    function resizeInfoWindow() {
      if (!infoWindow) return;
      const el = document.querySelector(".custom-infowindow");
      if (!el) return;
      const h = Math.min(Math.max(el.offsetHeight + 24, 120), 520);
      if (typeof infoWindow.setHeight === "function") infoWindow.setHeight(h);
      if (typeof infoWindow.setWidth === "function") infoWindow.setWidth(INFO_WINDOW_WIDTH);
    }

    /**
     * 更新左侧桥梁图片弹窗
     */
    function updateBridgeImagePopup(bridge) {
      const popup = document.getElementById("bridgeImgPopup");
      const imgEl = document.getElementById("bridgeImgEl");
      const loadingEl = document.getElementById("bridgeImgLoading");
      const bodyEl = document.getElementById("bridgeImgBody");

      document.getElementById("bridgeImgTitle").textContent = bridge.name;
      document.getElementById("bridgeImgYear").textContent = bridge.year;

      /* 清除上一次加载失败的占位 */
      const oldErr = bodyEl.querySelector(".bridge-img-popup-error");
      if (oldErr) oldErr.remove();

      if (!bridge.image) {
        popup.classList.remove("visible");
        return;
      }

      loadingEl.style.display = "flex";
      loadingEl.textContent = "图片加载中…";
      imgEl.style.display = "none";
      imgEl.alt = bridge.name + " 实景图";

      imgEl.onload = function () {
        loadingEl.style.display = "none";
        imgEl.style.display = "block";
      };

      imgEl.onerror = function () {
        imgEl.style.display = "none";
        loadingEl.style.display = "none";
        if (!bodyEl.querySelector(".bridge-img-popup-error")) {
          const err = document.createElement("div");
          err.className = "bridge-img-popup-error";
          err.textContent = "图片暂时无法加载";
          bodyEl.appendChild(err);
        }
      };

      imgEl.src = bridge.image;
      popup.classList.add("visible");
    }

    /** 隐藏左侧图片弹窗（重置地图时） */
    function hideBridgeImagePopup() {
      document.getElementById("bridgeImgPopup").classList.remove("visible");
    }

    /**
     * 更新右侧面板
     */
    function updateInfoPanel(bridge, highlight) {
      const panel = document.getElementById("infoPanel");
      document.getElementById("displayYear").textContent =
        bridge.year + " 年" + (bridge.actualYear !== bridge.year ? `（实际 ${bridge.actualYear} 年）` : "");
      document.getElementById("displayName").textContent = bridge.name;
      document.getElementById("displayMeta").textContent =
        `${bridge.type} · 东经 ${bridge.lng.toFixed(3)}° 北纬 ${bridge.lat.toFixed(3)}°`;
      document.getElementById("displayDesc").textContent = bridge.desc + (bridge.note ? "\n\n【说明】" + bridge.note : "");
      document.getElementById("bridgeYearShort").textContent =
        String(bridge.year % 100).padStart(2, "0");
      panel.classList.toggle("highlight", !!highlight);
    }

    /**
     * 聚焦到指定桥梁：飞行动画、打开信息窗、更新标记样式
     */
    function focusBridge(index, options = {}) {
      const { animate = true, highlight = true } = options;
      if (index < 0 || index >= BRIDGES.length) return;
      currentBridgeIndex = index;
      const bridge = BRIDGES[index];

      const point = new BMapGL.Point(bridge.lng, bridge.lat);
      if (typeof map.flyTo === "function") {
        map.flyTo(point, 14, { duration: animate ? 1200 : 0 });
      } else {
        map.centerAndZoom(point, 14);
      }

      markers.forEach((m, i) => {
        m.setIcon(createMarkerIcon(i === index));
        if (i === index && typeof m.setAnimation === "function") {
          m.setAnimation(BMAP_ANIMATION_BOUNCE);
          setTimeout(() => m.setAnimation(null), 1500);
        }
      });

      infoWindow.setContent(buildInfoWindowContent(bridge));
      map.openInfoWindow(infoWindow, point);
      setTimeout(resizeInfoWindow, 50);

      updateInfoPanel(bridge, highlight);
      updateBridgeImagePopup(bridge);

      document.getElementById("yearSlider").value = bridge.year;
      document.getElementById("sliderYearText").textContent = bridge.year + " 年";
      document.querySelectorAll(".year-tick").forEach((el) => {
        el.classList.toggle("active", parseInt(el.dataset.year, 10) === bridge.year);
      });
    }

    /**
     * 初始化所有标记点
     */
    function initMarkers() {
      markers = BRIDGES.map((bridge, i) => {
        const point = new BMapGL.Point(bridge.lng, bridge.lat);
        const marker = new BMapGL.Marker(point, { icon: createMarkerIcon(i === 0) });
        marker.addEventListener("click", () => focusBridge(i));
        map.addOverlay(marker);
        return marker;
      });
    }

    /**
     * 初始化时间轴刻度按钮（仅有桥梁的年份）
     */
    function initYearTicks() {
      const container = document.getElementById("yearTicks");
      bridgeYears.forEach((y) => {
        const btn = document.createElement("button");
        btn.className = "year-tick" + (y === 2000 ? " active" : "");
        btn.dataset.year = y;
        btn.textContent = y;
        btn.type = "button";
        btn.style.left = yearToPercent(y) + "%";
        btn.title = y + " 年";
        btn.addEventListener("click", () => {
          const idx = BRIDGES.findIndex((b) => b.year === y);
          focusBridge(idx);
        });
        container.appendChild(btn);
      });
    }

    /**
     * 鼠标在地图上移动时，顶部实时显示经纬度
     */
    function initMapCoordTracker() {
      const coordText = document.getElementById("mapCoordText");
      const mapEl = document.getElementById("mapContainer");
      const emptyLabel = "经度 —°　纬度 —°";

      function showCoord(lng, lat) {
        coordText.textContent =
          "经度 " + lng.toFixed(6) + "°　纬度 " + lat.toFixed(6) + "°";
      }

      function updateFromPixel(x, y) {
        if (!map || typeof map.pixelToPoint !== "function") return;
        const point = map.pixelToPoint(new BMapGL.Pixel(x, y));
        if (point && point.lng != null && point.lat != null) {
          showCoord(point.lng, point.lat);
        }
      }

      mapEl.addEventListener("mousemove", (ev) => {
        const rect = mapEl.getBoundingClientRect();
        updateFromPixel(ev.clientX - rect.left, ev.clientY - rect.top);
      });

      mapEl.addEventListener("mouseleave", () => {
        coordText.textContent = emptyLabel;
      });

      if (typeof map.addEventListener === "function") {
        map.addEventListener("mousemove", (e) => {
          const ll = e.latlng || e.latLng || e.point;
          if (ll && ll.lng != null && ll.lat != null) {
            showCoord(ll.lng, ll.lat);
          }
        });
      }
    }

    /**
     * 初始化百度地图
     */
    function initMap() {
      map = new BMapGL.Map("mapContainer");
      const center = new BMapGL.Point(INITIAL_CENTER.lng, INITIAL_CENTER.lat);
      map.centerAndZoom(center, INITIAL_ZOOM);
      map.enableScrollWheelZoom(true);
      map.setTilt(0);
      map.setHeading(0);

      infoWindow = new BMapGL.InfoWindow("", {
        width: INFO_WINDOW_WIDTH,
        height: 200,
        title: "",
        enableAutoPan: true
      });

      initMarkers();
      initYearTicks();
      initMapCoordTracker();

      document.getElementById("loadingOverlay").classList.add("hidden");
      document.getElementById("mapFrame").classList.add("loaded");

      focusBridge(0, { animate: false, highlight: false });
    }

    /**
     * 重置地图到贵州省初始视角
     */
    function resetMap() {
      stopPlay();
      const center = new BMapGL.Point(INITIAL_CENTER.lng, INITIAL_CENTER.lat);
      if (typeof map.flyTo === "function") {
        map.flyTo(center, INITIAL_ZOOM, { duration: 1000 });
      } else {
        map.centerAndZoom(center, INITIAL_ZOOM);
      }
      map.setTilt(0);
      map.setHeading(0);
      map.closeInfoWindow();
      hideBridgeImagePopup();
      markers.forEach((m) => m.setAnimation(null));
      document.getElementById("infoPanel").classList.remove("highlight");
    }

    /**
     * 切换地图模式：普通 / 卫星 / 三维倾斜
     */
    function toggleMapMode() {
      mapModeIndex = (mapModeIndex + 1) % 3;
      document.getElementById("mapModeLabel").textContent = "模式：" + mapModes[mapModeIndex];

      if (mapModeIndex === 0) {
        map.setMapType(BMAP_NORMAL_MAP);
        map.setTilt(0);
      } else if (mapModeIndex === 1) {
        map.setMapType(BMAP_SATELLITE_MAP);
        map.setTilt(0);
      } else {
        map.setMapType(BMAP_SATELLITE_MAP);
        map.setTilt(55);
        map.setHeading(15);
      }
    }

    /**
     * 自动播放：按桥梁年份顺序逐年跳转
     */
    function togglePlay() {
      if (isPlaying) {
        stopPlay();
        return;
      }
      isPlaying = true;
      document.getElementById("btnPlay").classList.add("active");
      document.getElementById("btnPlay").innerHTML = '<i class="fas fa-pause"></i> 暂停';

      let idx = currentBridgeIndex;
      playTimer = setInterval(() => {
        idx = (idx + 1) % BRIDGES.length;
        focusBridge(idx);
        if (idx === BRIDGES.length - 1) {
          /* 播放到最后一座后下一轮继续循环 */
        }
      }, 3500);
    }

    function stopPlay() {
      isPlaying = false;
      if (playTimer) {
        clearInterval(playTimer);
        playTimer = null;
      }
      document.getElementById("btnPlay").classList.remove("active");
      document.getElementById("btnPlay").innerHTML = '<i class="fas fa-play"></i> 播放动画';
    }

    /* ---------- 事件绑定 ---------- */
    document.getElementById("yearSlider").addEventListener("input", (e) => {
      const year = parseInt(e.target.value, 10);
      document.getElementById("sliderYearText").textContent = year + " 年";
      const idx = findBridgeIndexByYear(year);
      if (BRIDGES[idx].year === year) {
        focusBridge(idx);
      }
    });

    document.getElementById("yearSlider").addEventListener("change", (e) => {
      const year = parseInt(e.target.value, 10);
      const idx = findBridgeIndexByYear(year);
      focusBridge(idx);
    });

    document.getElementById("btnPlay").addEventListener("click", togglePlay);
    document.getElementById("btnReset").addEventListener("click", resetMap);
    document.getElementById("btnMapMode").addEventListener("click", toggleMapMode);

    /* 地图 API 加载完成后初始化 */
    function waitForBMap() {
      if (typeof BMapGL !== "undefined") {
        initMap();
      } else {
        setTimeout(waitForBMap, 100);
      }
    }

    window.onload = function () {
      document.getElementById("akHint").textContent =
        "小编提醒大家，网页内容可能与现实有所出入，请大家以官方为准！";
      waitForBMap();
    };
  </script>
</body>
